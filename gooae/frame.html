<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOOAE</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Silkscreen&display=swap">
<style>
/* Desktop device frame: a toy made for a phone, held like a device, never shrunk. */
:root { color-scheme: dark; --h: clamp(600px, calc(100dvh - 56px), 960px); }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #07020d; color: #F4E9FF; overflow: auto; }
body {
  min-height: 100dvh; display: grid; place-items: center; padding: 28px;
  background:
    radial-gradient(40vmax 34vmax at 18% 22%, rgba(176, 0, 255, .30), transparent 60%),
    radial-gradient(36vmax 30vmax at 82% 78%, rgba(240, 0, 168, .26), transparent 60%),
    radial-gradient(30vmax 24vmax at 76% 16%, rgba(37, 217, 255, .14), transparent 60%),
    radial-gradient(28vmax 22vmax at 24% 86%, rgba(232, 255, 101, .08), transparent 60%),
    #07020d;
}
.bezel {
  position: relative;
  height: var(--h); aspect-ratio: 9 / 19.5;
  padding: 11px; border-radius: 52px;
  background:
    linear-gradient(145deg, rgba(255,255,255,.55), rgba(217,165,255,.18) 18%, rgba(176,0,255,.32) 45%, rgba(240,0,168,.30) 70%, rgba(255,255,255,.45));
  box-shadow:
    0 0 0 1px rgba(255,255,255,.35) inset,
    0 2px 0 rgba(255,255,255,.45) inset,
    0 30px 90px rgba(176, 0, 255, .35),
    0 0 140px rgba(240, 0, 168, .22);
}
.bezel::before { /* lip-gloss highlight */
  content: ''; position: absolute; inset: 4px; border-radius: 48px; pointer-events: none;
  background: linear-gradient(170deg, rgba(255,255,255,.35), transparent 22%);
  mix-blend-mode: screen;
}
iframe {
  display: block; width: 100%; height: 100%; border: 0; border-radius: 42px;
  background: #100817;
  box-shadow: 0 0 0 1px rgba(0,0,0,.6);
}
.mark, .out {
  position: fixed; z-index: 2;
  font: 400 11px/1 'Silkscreen', ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase;
  color: #F4E9FF; text-decoration: none;
}
.mark { top: 24px; left: 28px; font: 800 22px/1 'Cinzel', Georgia, serif; letter-spacing: .08em;
  background: linear-gradient(100deg, #fff, #D9A5FF 30%, #fff 45%, #FF4BBF 70%, #25D9FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
.out { bottom: 24px; right: 28px; padding: 12px 16px; border-radius: 999px;
  background: rgba(16,8,23,.45); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(10px); }
.mark:focus-visible, .out:focus-visible { outline: 2px solid #E8FF65; outline-offset: 3px; }
</style>
</head>
<body>
<a class="mark" href="./" aria-label="GOOAE home">GOOAE</a>
<main class="bezel"><iframe id="toy" title="GOOAE toy" allow="accelerometer; gyroscope; magnetometer; microphone; camera; autoplay; fullscreen; clipboard-write"></iframe></main>
<a class="out" id="out" href="./">Full window ↗</a>
<script>
(function () {
  var slug = new URLSearchParams(location.search).get('toy') || '';
  if (!/^[a-z0-9-]+$/.test(slug)) { location.replace('./'); return; }
  var path = 'toys/' + slug + '/';
  var f = document.getElementById('toy');
  f.src = path + '?framed=1' + location.hash;
  document.getElementById('out').href = path + '?noframe=1' + location.hash;
  fetch('toys.json').then(function (r) { return r.json(); }).then(function (reg) {
    var t = (reg.toys || []).filter(function (x) { return x.slug === slug; })[0];
    if (t) { document.title = t.title + ' · GOOAE'; f.title = t.title; }
  }).catch(function () {});
  f.addEventListener('load', function () { try { f.contentWindow.focus(); } catch (e) {} });
})();
</script>
</body>
</html>
