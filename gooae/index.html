<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOOAE · the Blossom</title>
<meta name="description" content="GOOAE, the Infinite Melt Cosmos: a blossom of bubble portals into goo toys, oracle creatures and melting worlds. Tap a bubble, knock three times.">
<meta name="theme-color" content="#100817">
<meta property="og:title" content="GOOAE · the Blossom">
<meta property="og:description" content="Tap a bubble, knock three times, enter the goo.">
<meta property="og:image" content="https://osstessela.com/gooae/toys/flood-oracle/poster.webp">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Silkscreen&family=Syne:wght@500;700&display=swap">
<link rel="stylesheet" href="shell/gooae-tokens.css">
<style>
/* ═══════════════════════════════════════════════════════════════
   THE BLOSSOM — an ancient cosmic being landed in the radical 90s:
   lava lamps, maximal colour grading, lip-gloss goo.
   ═══════════════════════════════════════════════════════════════ */
:root {
  --ink: #F4E9FF; --ink-soft: #D9A5FF; --void: #100817;
  --glass: rgba(16, 8, 23, .42); --rim: rgba(255, 255, 255, .26);
  --pixel: 'Silkscreen', ui-monospace, monospace;
  --serif: 'Cinzel', Georgia, serif;
  --sans: 'Syne', system-ui, sans-serif;
  --squish: cubic-bezier(.34, 1.56, .64, 1);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
html[data-theme="light"] {
  --ink: #2a0a3a; --ink-soft: #6b2a8a; --void: #F4E9FF;
  --glass: rgba(255, 255, 255, .45); --rim: rgba(120, 30, 160, .28);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #07020d; color: var(--ink); overflow: hidden; }
html[data-theme="light"], html[data-theme="light"] body { background: #e9dcf5; }
body { font: 500 16px/1.4 var(--sans); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }

/* the device: full-bleed on phones, a glass bezel on desktop */
.device { position: fixed; inset: 0; overflow: hidden; }
@media (min-width: 900px) and (pointer: fine) {
  .device {
    inset: 18px; border-radius: 40px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.28),
      0 0 0 10px rgba(176, 0, 255, .16),
      0 0 0 11px rgba(255,255,255,.22),
      0 30px 120px rgba(176, 0, 255, .30),
      0 0 160px rgba(240, 0, 168, .18);
  }
  html[data-theme="light"] .device { box-shadow: 0 0 0 1px rgba(120,30,160,.3), 0 0 0 10px rgba(255,255,255,.55), 0 0 0 11px rgba(120,30,160,.25), 0 30px 120px rgba(240, 0, 168, .22); }
}
#stage { position: absolute; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
#stage:active { cursor: grabbing; }
#goo, #fallback { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fallback[hidden] { display: none; }
#fallback { background: radial-gradient(120% 90% at 50% 40%, #2a0a3a, #07020d); }
html[data-theme="light"] #fallback[hidden] { display: none; }
#fallback { background: radial-gradient(120% 90% at 50% 40%, #fff, #e9dcf5); }

/* ── top bar ── */
.topbar {
  position: absolute; z-index: 10; left: 0; right: 0; top: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(14px + var(--safe-t)) 18px 0;
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.wordmark {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
  font: 900 26px/1 var(--serif); letter-spacing: .06em;
  background: linear-gradient(100deg, #fff 0%, #D9A5FF 25%, #fff 40%, #FF4BBF 62%, #25D9FF 85%, #fff 100%);
  background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 10px rgba(240, 0, 168, .45));
  animation: chrome 9s linear infinite;
}
html[data-theme="light"] .wordmark { background-image: linear-gradient(100deg, #5a0a7a, #B000FF 30%, #F000A8 60%, #0a8ab0 85%, #5a0a7a); filter: none; }
.wordmark .star { font: 400 18px/1 system-ui; color: #FF4BBF; -webkit-text-fill-color: #FF4BBF; }
@keyframes chrome { to { background-position: -220% 0; } }

/* light-switch toggle (sun / moon) */
.switch {
  all: unset; box-sizing: border-box; position: relative; cursor: pointer; pointer-events: auto;
  width: 84px; height: 44px; border-radius: 999px;
  display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
  font: 400 15px/1 system-ui, sans-serif; color: rgba(255,255,255,.75);
  background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(176,0,255,.18) 50%, rgba(16,8,23,.45));
  border: 1px solid var(--rim);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -6px 12px rgba(176,0,255,.25), 0 6px 20px rgba(7,2,13,.35);
  -webkit-backdrop-filter: blur(12px) saturate(1.5); backdrop-filter: blur(12px) saturate(1.5);
}
.switch::after {
  content: ''; position: absolute; top: 5px; right: 6px; width: 32px; height: 32px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff 0 18%, #D9A5FF 50%, #7200C9);
  box-shadow: 0 2px 10px rgba(0,0,0,.45), 0 0 12px rgba(176,0,255,.6);
  transition: transform 420ms var(--squish), background 280ms ease;
}
.switch[aria-checked="true"]::after { transform: translateX(-34px); background: radial-gradient(circle at 35% 30%, #fff 0 18%, #FFCB37 52%, #ff7a00); box-shadow: 0 2px 10px rgba(0,0,0,.25), 0 0 16px rgba(255,203,55,.8); }
.switch:focus-visible, .bead:focus-visible, .bloom-opt:focus-visible, .enter:focus-visible, .knock:focus-visible, .wordmark:focus-visible { outline: 2px solid #E8FF65; outline-offset: 4px; }

/* ── the vortex title banner ── */
.vortex-title {
  position: absolute; z-index: 3; transform: translate(-50%, -50%);
  width: calc(var(--r0) * 2.3); text-align: center; pointer-events: none;
  transition: opacity 420ms ease, transform 650ms var(--squish), filter 420ms ease;
}
.vortex-title .big {
  display: block;
  font: 900 calc(var(--r0) * .5)/1 var(--serif); letter-spacing: .05em;
  background: linear-gradient(100deg, #fff 0%, #ffd6f4 20%, #fff 34%, #FF4BBF 52%, #D9A5FF 66%, #25D9FF 82%, #fff 100%);
  background-size: 240% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 rgba(60, 0, 80, .65)) drop-shadow(0 0 18px rgba(240, 0, 168, .7));
  animation: chrome 7s linear infinite;
}
.vortex-title .sub {
  display: block; margin-top: calc(var(--r0) * .08);
  font: 400 max(11px, calc(var(--r0) * .085))/1.3 var(--pixel); letter-spacing: .14em; text-transform: uppercase;
  color: #fff; text-shadow: 0 0 10px rgba(240, 0, 168, .9), 0 1px 0 rgba(60,0,80,.8);
}
html[data-theme="light"] .vortex-title .sub { color: #fff; }
.vortex-title.compact .sub { display: none; }
.vortex-title.covered { opacity: 0; transform: translate(-50%, -50%) scale(.7); filter: blur(6px); }

/* ── beads: liquid bubble portals ── */
#beads { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
.bead {
  all: unset; box-sizing: border-box; position: absolute; left: 0; top: 0;
  width: var(--b, 56px); height: var(--b, 56px); border-radius: 50%;
  pointer-events: auto; cursor: pointer; will-change: transform;
  -webkit-tap-highlight-color: transparent;
}
.bead-orb {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 50% 62%, var(--t1), var(--t2) 70%, #120018 100%);
  box-shadow:
    inset 0 0 0 1.5px rgba(255,255,255,.6),
    inset 0 -9px 18px rgba(20, 0, 40, .45),
    inset 0 7px 14px rgba(255,255,255,.4),
    0 0 22px color-mix(in srgb, var(--t1) 65%, transparent),
    0 8px 22px rgba(7, 2, 13, .45);
  transition: transform 280ms var(--squish), box-shadow 280ms ease;
}
.bead-orb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .86; filter: saturate(1.25) contrast(1.05); }
.bead-orb::before { /* thin-film rim */
  content: ''; position: absolute; inset: 0; border-radius: 50%; z-index: 1;
  background: conic-gradient(from 0deg, rgba(255,0,170,.6), rgba(0,240,200,.5), rgba(232,255,101,.5), rgba(37,217,255,.6), rgba(176,0,255,.6), rgba(255,0,170,.6));
  -webkit-mask: radial-gradient(circle, transparent 54%, #000 74%); mask: radial-gradient(circle, transparent 54%, #000 74%);
  mix-blend-mode: screen; opacity: .8;
  animation: spin 9s linear infinite;
}
.bead-orb::after { /* lip-gloss highlight */
  content: ''; position: absolute; inset: 0; border-radius: 50%; z-index: 2;
  background:
    radial-gradient(circle at 32% 25%, rgba(255,255,255,.95) 0 7%, rgba(255,255,255,.4) 13%, transparent 28%),
    radial-gradient(circle at 72% 80%, rgba(255,255,255,.45) 0 4%, transparent 12%);
}
@keyframes spin { to { transform: rotate(360deg); } }
.bead-glyph {
  position: absolute; right: -4px; bottom: -4px; z-index: 3;
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font: 400 13px/1 system-ui, sans-serif; color: #fff;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.7), var(--t1) 55%, var(--t2));
  border: 1px solid rgba(255,255,255,.6); box-shadow: 0 2px 8px rgba(0,0,0,.4);
  text-shadow: 0 1px 2px rgba(0,0,0,.6);
}
.bead-name {
  position: absolute; left: 50%; top: 100%; z-index: 5;
  transform: translate(-50%, 4px) scale(.9); opacity: 0;
  padding: 7px 12px; border-radius: 999px; white-space: nowrap;
  font: 700 14px/1 var(--sans); letter-spacing: .02em; color: #fff;
  background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(176,0,255,.35) 55%, rgba(16,8,23,.7));
  border: 1px solid rgba(255,255,255,.3);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 6px 18px rgba(7,2,13,.45);
  pointer-events: none;
  transition: opacity 200ms ease, transform 280ms var(--squish);
}
.bead:hover .bead-orb, .bead:focus-visible .bead-orb { transform: scale(1.2); box-shadow: inset 0 0 0 2px #fff, inset 0 -9px 18px rgba(20,0,40,.45), inset 0 7px 14px rgba(255,255,255,.5), 0 0 34px var(--t1), 0 0 60px color-mix(in srgb, var(--t2) 60%, transparent); }
.bead:hover .bead-name, .bead:focus-visible .bead-name { opacity: 1; transform: translate(-50%, 14px) scale(1); }
.bead:active .bead-orb { transform: scale(.92); }
.bead.is-pulled { visibility: hidden; }
.bead.is-return .bead-orb { animation: pulse 1.1s ease-in-out 3; }
@keyframes pulse { 50% { transform: scale(1.28); box-shadow: 0 0 0 6px rgba(232,255,101,.6), 0 0 40px var(--t1); } }

/* ── the pulled bubble ── */
#portal { position: absolute; z-index: 6; width: var(--S, 300px); height: var(--S, 300px); }
#portal[hidden] { display: none; }
.portal-orb {
  position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
  background: radial-gradient(circle at 50% 60%, var(--t1), var(--t2) 70%, #120018);
  box-shadow:
    0 0 0 2px rgba(255,255,255,.7),
    0 0 50px color-mix(in srgb, var(--t1) 80%, transparent),
    0 0 120px color-mix(in srgb, var(--t2) 55%, transparent),
    0 20px 60px rgba(7,2,13,.55);
}
.portal-orb img, .portal-orb iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.portal-orb iframe { pointer-events: none; opacity: 0; transition: opacity 900ms ease; background: transparent; }
.portal-orb iframe.ready { opacity: 1; }
.portal-orb.drift img { animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { from { transform: scale(1.05) translate(-2%, -1%); } to { transform: scale(1.18) translate(2%, 2%); } }
.portal-film {
  position: absolute; inset: -2px; border-radius: 50%; pointer-events: none;
  background:
    radial-gradient(circle at 30% 22%, rgba(255,255,255,.85) 0 4%, rgba(255,255,255,.3) 9%, transparent 20%),
    radial-gradient(circle at 74% 82%, rgba(255,255,255,.35) 0 3%, transparent 9%);
}
.portal-film::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 90deg, rgba(255,0,170,.75), rgba(0,240,200,.6), rgba(232,255,101,.6), rgba(37,217,255,.75), rgba(176,0,255,.75), rgba(255,0,170,.75));
  -webkit-mask: radial-gradient(circle, transparent 63%, #000 77%); mask: radial-gradient(circle, transparent 63%, #000 77%);
  mix-blend-mode: screen;
  animation: spin 16s linear infinite;
}
.knock { all: unset; pointer-events: auto; position: absolute; inset: 0; border-radius: 50%; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.portal-name {
  position: absolute; left: 50%; bottom: calc(100% + 14px); transform: translateX(-50%);
  white-space: nowrap; font: 800 clamp(18px, 2.6vw, 26px)/1 var(--serif); letter-spacing: .04em;
  background: linear-gradient(100deg, #fff, #ffd6f4 25%, #fff 40%, #FF4BBF 65%, #25D9FF);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 12px rgba(240,0,168,.7)) drop-shadow(0 2px 0 rgba(40,0,60,.7));
}
.pips { position: absolute; left: 50%; top: calc(100% + 14px); transform: translateX(-50%); display: flex; gap: 12px; }
.pips i {
  width: 14px; height: 14px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.75), rgba(255,255,255,.12) 45%, rgba(16,8,23,.5));
  border: 1px solid rgba(255,255,255,.5);
  transition: transform 280ms var(--squish), background 200ms;
}
.pips i.on { background: radial-gradient(circle at 35% 30%, #fff 0 18%, #E8FF65 50%, #7bd400); box-shadow: 0 0 12px #E8FF65; transform: scale(1.25); }
#portal.squish .portal-orb, #portal.squish .portal-film { animation: squish 420ms var(--squish); }
@keyframes squish { 0% { transform: scale(1); } 25% { transform: scale(.92, 1.05); } 60% { transform: scale(1.04, .97); } 100% { transform: scale(1); } }
.knock-ring {
  position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
  border: 3px solid rgba(255,255,255,.85); box-shadow: 0 0 20px var(--t1);
  animation: ring 850ms cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes ring { to { transform: scale(1.55); opacity: 0; } }
.ripple-out {
  position: absolute; z-index: 20; border-radius: 50%; pointer-events: none;
  transform: translate(-50%, -50%);
  background:
    radial-gradient(circle, rgba(255,255,255,.9) 0 6%, transparent 7% 12%, rgba(255,255,255,.35) 13%, transparent 15%),
    radial-gradient(circle, var(--t1), var(--t2) 55%, #100817 75%);
}

/* ── bottom dock: bloom selector + ENTER THE GOO ── */
.dock {
  position: absolute; z-index: 8; left: 0; right: 0; bottom: calc(18px + var(--safe-b));
  display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none;
}
.dock > * { pointer-events: auto; }
.bloom { display: flex; gap: 10px; padding: 6px; border-radius: 999px; background: rgba(16,8,23,.25); border: 1px solid rgba(255,255,255,.12); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
html[data-theme="light"] .bloom { background: rgba(255,255,255,.3); border-color: rgba(120,30,160,.18); }
html[data-theme="light"] .bloom-opt { color: #2a0a3a; text-shadow: 0 1px 0 rgba(255,255,255,.7); border-color: rgba(120,30,160,.35); }
.bloom-opt {
  all: unset; box-sizing: border-box; cursor: pointer; position: relative; pointer-events: auto;
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  font: 400 14px/1 var(--pixel); color: #fff; text-shadow: 0 1px 2px rgba(40,0,60,.8);
  background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.85) 0 8%, rgba(255,255,255,.18) 22%, rgba(176,0,255,.55) 65%, rgba(60,0,90,.8));
  border: 1px solid rgba(255,255,255,.4);
  box-shadow: inset 0 -5px 10px rgba(40,0,60,.4), 0 4px 12px rgba(7,2,13,.35);
  transition: transform 280ms var(--squish), box-shadow 280ms ease;
}
.bloom-opt:nth-child(5n+1) { --c: #F000A8; } .bloom-opt:nth-child(5n+2) { --c: #7200C9; } .bloom-opt:nth-child(5n+3) { --c: #25D9FF; }
.bloom-opt:nth-child(5n+4) { --c: #E8FF65; } .bloom-opt:nth-child(5n+5) { --c: #FFCB37; }
.bloom-opt { background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.85) 0 8%, rgba(255,255,255,.18) 22%, color-mix(in srgb, var(--c) 70%, transparent) 62%, rgba(40,0,60,.85)); }
.bloom-opt:hover { transform: scale(1.12); }
.bloom-opt[aria-pressed="true"] { box-shadow: 0 0 0 2px #fff, 0 0 18px var(--c), 0 0 34px var(--c); transform: scale(1.08); }
.bloom-opt.is-locked { opacity: .35; cursor: not-allowed; filter: grayscale(.6); }
.bloom-opt.is-pulse { animation: bpulse 1.1s ease-in-out 3; }
@keyframes bpulse { 50% { box-shadow: 0 0 0 4px #E8FF65, 0 0 26px #E8FF65; transform: scale(1.15); } }
.enter {
  all: unset; box-sizing: border-box; cursor: pointer; pointer-events: auto;
  min-height: 52px; padding: 0 28px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 12px;
  font: 800 17px/1 var(--serif); letter-spacing: .1em; color: #fff;
  text-shadow: 0 0 10px rgba(255,255,255,.7), 0 1px 0 rgba(80,0,90,.8);
  background:
    linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.08) 46%, rgba(240,0,168,.0) 50%),
    linear-gradient(100deg, #B000FF, #F000A8 45%, #FF4BBF 70%, #B000FF);
  border: 1px solid rgba(255,255,255,.55);
  box-shadow: inset 0 -8px 16px rgba(80,0,120,.45), 0 0 24px rgba(240,0,168,.6), 0 10px 30px rgba(7,2,13,.45);
  transition: transform 140ms var(--squish), box-shadow 280ms ease;
  animation: enterIn 420ms var(--squish);
}
.enter[hidden] { display: inline-flex; visibility: hidden; animation: none; }
.enter:hover { transform: scale(1.04); box-shadow: inset 0 -8px 16px rgba(80,0,120,.45), 0 0 36px rgba(240,0,168,.85), 0 10px 30px rgba(7,2,13,.45); }
.enter:active { transform: scale(.95); }
.enter .spark { font: 400 16px/1 system-ui; }
@keyframes enterIn { from { transform: scale(.6); opacity: 0; } }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 420px) {
  .wordmark { font-size: 22px; }
  .bloom { gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  .wordmark, .vortex-title .big, .bead-orb::before, .portal-film::before { animation: none; }
}
html[data-gs-motion="reduce"] .wordmark, html[data-gs-motion="reduce"] .vortex-title .big,
html[data-gs-motion="reduce"] .bead-orb::before, html[data-gs-motion="reduce"] .portal-film::before { animation: none; }
</style>
</head>
<body>
<div class="device">
  <div id="stage">
    <canvas id="goo" aria-hidden="true"></canvas>
    <svg id="fallback" aria-hidden="true" hidden></svg>

    <div class="vortex-title" id="vortexTitle" aria-hidden="true">
      <span class="big">GOOAE</span>
      <span class="sub">✧ the infinite melt cosmos ✧</span>
    </div>

    <nav id="beads" aria-label="GOOAE toys: tap a bubble to pull it in, then knock three times"></nav>
    <div id="portal" hidden></div>
  </div>

  <header class="topbar">
    <a class="wordmark" href="./" aria-label="GOOAE home"><span>GOOAE</span><span class="star" aria-hidden="true">✧</span></a>
    <button class="switch" id="theme" type="button" role="switch" aria-checked="false" aria-label="Light mode"><span aria-hidden="true">☾</span><span aria-hidden="true">☀</span></button>
  </header>

  <div class="dock">
    <button class="enter" id="enter" type="button" hidden><span class="spark" aria-hidden="true">✧</span>ENTER THE GOO<span class="spark" aria-hidden="true">✧</span></button>
    <div class="bloom" id="bloom" role="group" aria-label="Bloom selector: jump to an arm"></div>
  </div>
</div>
<h1 class="sr">GOOAE · the Blossom</h1>
<p class="sr" id="live" aria-live="polite"></p>
<script src="blossom/blossom.js" defer></script>
</body>
</html>
