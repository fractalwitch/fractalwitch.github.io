<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PERCUSSIVE MOUTH-WIND: Acoustic Soup &amp; Punctuation Warfare Lab</title>
  <style>
    :root {
      --void-bg: #06050d;
      --glass-bg: rgba(11, 10, 24, 0.82);
      --glass-border: rgba(148, 163, 184, 0.2);
      --cyan-wave: #38f2ff;
      --amber-gold: #ffbe55;
      --magenta-volt: #ff3b9a;
      --crimson-dagger: #ff2e55;
      --indigo-fog: #818cf8;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--void-bg);
      color: #f1f5f9;
      font-family: var(--font-sans);
      user-select: none;
    }

    #labCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Top HUD with mandatory 44px left clearance for mobile top-left close buttons */
    #topHud {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 25;
      border-radius: 16px;
      padding: 8px 12px 8px 44px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      pointer-events: auto;
    }

    .hud-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pulse-orb {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan-wave);
      box-shadow: 0 0 10px var(--cyan-wave);
      flex-shrink: 0;
      animation: orbBeat 1.8s infinite ease-in-out;
    }

    @keyframes orbBeat {
      0%, 100% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    .brand-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #ffffff;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 9px;
      color: #94a3b8;
      letter-spacing: 0.05em;
      margin-top: 1px;
    }

    .telemetry-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .metric-cell {
      display: flex;
      flex-direction: column;
    }

    .metric-label {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .metric-value {
      font-size: 12px;
      font-weight: 800;
      line-height: 1.15;
    }

    .val-coherence {
      color: var(--cyan-wave);
      text-shadow: 0 0 8px rgba(56, 242, 255, 0.4);
    }

    .val-spiral {
      color: var(--crimson-dagger);
      text-shadow: 0 0 8px rgba(255, 46, 85, 0.4);
    }

    .val-glyphs {
      color: var(--amber-gold);
      text-shadow: 0 0 8px rgba(255, 190, 85, 0.35);
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .hud-btn {
      border-radius: 10px;
      padding: 5px 8px;
      font-size: 10.5px;
      font-weight: 700;
      color: #e2e8f0;
      background: rgba(20, 19, 42, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.24);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .hud-btn:hover {
      background: rgba(36, 34, 70, 0.95);
      border-color: rgba(148, 163, 184, 0.45);
    }

    .hud-btn:active {
      transform: scale(0.96);
    }

    .hud-btn.active {
      background: rgba(56, 242, 255, 0.18);
      border-color: rgba(56, 242, 255, 0.6);
      color: #cffafe;
    }

    .hud-btn.breathe-btn {
      background: linear-gradient(135deg, rgba(56, 242, 255, 0.16), rgba(255, 190, 85, 0.18));
      border-color: rgba(255, 190, 85, 0.45);
      color: #fef3c7;
    }

    .hud-btn.breathe-btn.urgent {
      animation: urgentPulse 0.9s infinite alternate;
      border-color: var(--crimson-dagger);
      box-shadow: 0 0 14px rgba(255, 46, 85, 0.5);
    }

    @keyframes urgentPulse {
      from { transform: scale(1); background: rgba(255, 46, 85, 0.25); }
      to { transform: scale(1.04); background: rgba(255, 59, 154, 0.42); }
    }

    /* Collapsible Atmosphere & Ego-Interference Drawer */
    #atmoDrawer {
      display: none;
      grid-template-columns: 1fr;
      gap: 8px;
      padding-top: 7px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
    }

    #atmoDrawer.open {
      display: grid;
    }

    @media (min-width: 680px) {
      #atmoDrawer.open {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
    }

    .slider-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(8, 7, 18, 0.65);
      padding: 6px 9px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.14);
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 700;
      color: #cbd5e1;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.24);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cyan-wave);
      box-shadow: 0 0 8px var(--cyan-wave);
      border: 2px solid #06050d;
    }

    #sliderEgo::-webkit-slider-thumb {
      background: var(--magenta-volt);
      box-shadow: 0 0 8px var(--magenta-volt);
    }

    #sliderHumidity::-webkit-slider-thumb {
      background: var(--indigo-fog);
      box-shadow: 0 0 8px var(--indigo-fog);
    }

    /* Status Toast Pill inside top of safe arena */
    #statusToast {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      z-index: 22;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease;
      border-radius: 999px;
      padding: 5px 13px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      max-width: 92vw;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Bottom Control Dock */
    #bottomDock {
      position: fixed;
      bottom: 8px;
      left: 8px;
      right: 8px;
      margin: 0 auto;
      max-width: 820px;
      z-index: 25;
      border-radius: 18px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      pointer-events: auto;
    }

    .preset-strip {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 1px;
    }

    .preset-strip::-webkit-scrollbar {
      display: none;
    }

    .preset-pill {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 10.5px;
      font-weight: 700;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(18, 17, 38, 0.85);
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .preset-pill:hover {
      border-color: var(--cyan-wave);
      color: #ffffff;
    }

    .preset-pill[data-tone="harmonic"] { border-color: rgba(56, 242, 255, 0.35); color: #a5f3fc; }
    .preset-pill[data-tone="period"] { border-color: rgba(255, 46, 85, 0.45); color: #fda4af; }
    .preset-pill[data-tone="exclaim"] { border-color: rgba(255, 190, 85, 0.45); color: #fde68a; }
    .preset-pill[data-tone="ellipsis"] { border-color: rgba(129, 140, 248, 0.45); color: #c7d2fe; }

    .compose-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    #thoughtInput {
      flex: 1 1 180px;
      min-width: 0;
      border-radius: 12px;
      padding: 8px 11px;
      background: rgba(6, 5, 15, 0.9);
      border: 1px solid rgba(56, 242, 255, 0.32);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 13px;
      outline: none;
      user-select: text;
    }

    #thoughtInput:focus {
      border-color: var(--cyan-wave);
      box-shadow: 0 0 14px rgba(56, 242, 255, 0.25);
    }

    .ammo-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ammo-btn {
      border-radius: 10px;
      padding: 7px 8px;
      min-width: 32px;
      font-size: 12px;
      font-weight: 800;
      background: rgba(18, 17, 38, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #e2e8f0;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .ammo-btn:active {
      transform: scale(0.92);
    }

    .ammo-btn[data-punc="."] { color: var(--crimson-dagger); border-color: rgba(255, 46, 85, 0.42); }
    .ammo-btn[data-punc="!!!"] { color: var(--amber-gold); border-color: rgba(255, 190, 85, 0.42); }
    .ammo-btn[data-punc="..."] { color: var(--indigo-fog); border-color: rgba(129, 140, 248, 0.42); }
    .ammo-btn[data-punc="~"] { color: var(--cyan-wave); border-color: rgba(56, 242, 255, 0.42); }

    #launchBtn {
      border: none;
      border-radius: 12px;
      padding: 8px 13px;
      background: linear-gradient(135deg, #38f2ff, #ffbe55);
      color: #06050d;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(56, 242, 255, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: transform 0.12s ease, box-shadow 0.15s ease;
    }

    #launchBtn:hover {
      box-shadow: 0 0 24px rgba(56, 242, 255, 0.55);
    }

    #launchBtn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>
  <!-- Full-Viewport High-DPI Wave & Kinetic Typography Canvas -->
  <canvas id="labCanvas"></canvas>

  <!-- Top Telemetry & Atmosphere HUD (with mandatory 44px left clearance) -->
  <header id="topHud" class="glass-panel">
    <div class="hud-top-row">
      <div class="brand-group">
        <span class="pulse-orb"></span>
        <div>
          <div class="brand-title">PERCUSSIVE MOUTH-WIND</div>
          <div class="brand-sub mono">ACOUSTIC SOUP &amp; PUNCTUATION WARFARE LAB</div>
        </div>
      </div>

      <div class="telemetry-strip">
        <div class="metric-cell">
          <span class="metric-label">Phase Coherence</span>
          <span id="statCoherence" class="metric-value val-coherence mono">42%</span>
        </div>

        <div class="metric-cell">
          <span class="metric-label">Overthinking Spiral</span>
          <span id="statSpiral" class="metric-value val-spiral mono">0%</span>
        </div>

        <div class="metric-cell">
          <span class="metric-label">Glyphs Sent</span>
          <span id="statGlyphs" class="metric-value val-glyphs mono">0</span>
        </div>
      </div>

      <div class="hud-actions">
        <button id="btnSound" class="hud-btn" title="Toggle Web Audio Formant Synth">🔇 Sound</button>
        <button id="btnAtmoToggle" class="hud-btn" title="Adjust Crosswind, Humidity & Ego-Interference">🎛️ Atmosphere</button>
        <button id="btnBreathe" class="hud-btn breathe-btn" title="Calm the Receiver Skull & reset spiral">🌬️ Breathe / Reset</button>
      </div>
    </div>

    <!-- Collapsible Atmosphere & Ego-Interference Sliders -->
    <div id="atmoDrawer">
      <div class="slider-block">
        <div class="slider-header">
          <span>🌬️ Ambient Crosswind</span>
          <span id="valWind" class="mono" style="color:#38f2ff;">0%</span>
        </div>
        <input id="sliderWind" type="range" min="-100" max="100" value="0" />
      </div>

      <div class="slider-block">
        <div class="slider-header">
          <span>💧 Void Humidity (Drag &amp; Blur)</span>
          <span id="valHumidity" class="mono" style="color:#818cf8;">25%</span>
        </div>
        <input id="sliderHumidity" type="range" min="0" max="100" value="25" />
      </div>

      <div class="slider-block">
        <div class="slider-header">
          <span>🪞 Ego-Interference Mirrors</span>
          <span id="valEgo" class="mono" style="color:#ff3b9a;">30%</span>
        </div>
        <input id="sliderEgo" type="range" min="0" max="100" value="30" />
      </div>
    </div>
  </header>

  <!-- Toast Banner inside top of safe arena -->
  <div id="statusToast" class="glass-panel mono"></div>

  <!-- Bottom Composition & Punctuation Warfare Dock -->
  <footer id="bottomDock" class="glass-panel">
    <div class="preset-strip">
      <button class="preset-pill" data-tone="harmonic" data-text="I miss the quiet warmth of your voice ~">Tender Confession ~</button>
      <button class="preset-pill" data-tone="period" data-text="Okay. Sounds good.">Passive-Aggressive Okay.</button>
      <button class="preset-pill" data-tone="exclaim" data-text="Wait no I didn't mean it like that at all!!!">Frantic Over-Explain!!!</button>
      <button class="preset-pill" data-tone="ellipsis" data-text="I guess we can just talk whenever...">Heavy Ellipsis...</button>
    </div>

    <div class="compose-row">
      <input
        id="thoughtInput"
        type="text"
        maxlength="140"
        value="I miss the quiet warmth of your voice ~"
        placeholder="Type a sprawling tender feeling..."
        aria-label="Tender feeling input"
      />

      <div class="ammo-group" title="Append or swap trailing punctuation ammo">
        <button class="ammo-btn mono" data-punc=".">.</button>
        <button class="ammo-btn mono" data-punc="!!!">!!!</button>
        <button class="ammo-btn mono" data-punc="...">...</button>
        <button class="ammo-btn mono" data-punc="~">~</button>
      </div>

      <button id="launchBtn">
        <span>💨</span>
        <span>Launch Mouth-Wind</span>
      </button>
    </div>
  </footer>

  <script>
    (() => {
      'use strict';

      // =========================================================================
      // 1. PROCEDURAL WEB AUDIO FORMANT & RESONANCE SYNTHESIZER
      // =========================================================================
      class MouthWindAudio {
        constructor() {
          this.ctx = null;
          this.enabled = false;
          this.master = null;
          this.spiralOsc1 = null;
          this.spiralOsc2 = null;
          this.spiralGain = null;
        }

        ensureInit() {
          if (this.ctx) {
            if (this.ctx.state === 'suspended') {
              this.ctx.resume().catch(() => {});
            }
            return;
          }
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;

          this.ctx = new AudioCtx();
          this.master = this.ctx.createGain();
          this.master.gain.value = this.enabled ? 0.75 : 0.0001;
          this.master.connect(this.ctx.destination);

          // Continuous subtle detuned tremolo warble for Overthinking Spiral
          this.spiralGain = this.ctx.createGain();
          this.spiralGain.gain.value = 0.0001;

          this.spiralOsc1 = this.ctx.createOscillator();
          this.spiralOsc2 = this.ctx.createOscillator();
          this.spiralOsc1.type = 'sawtooth';
          this.spiralOsc2.type = 'triangle';
          this.spiralOsc1.frequency.value = 146.83; // D3
          this.spiralOsc2.frequency.value = 155.56; // Eb3 dissonant semitone

          const lp = this.ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = 420;

          const lfo = this.ctx.createOscillator();
          lfo.type = 'sine';
          lfo.frequency.value = 6.5; // Nervous tremolo
          const lfoGain = this.ctx.createGain();
          lfoGain.gain.value = 18;
          lfo.connect(lfoGain);
          lfoGain.connect(this.spiralOsc1.frequency);

          this.spiralOsc1.connect(lp);
          this.spiralOsc2.connect(lp);
          lp.connect(this.spiralGain);
          this.spiralGain.connect(this.master);

          this.spiralOsc1.start();
          this.spiralOsc2.start();
          lfo.start();
        }

        setEnabled(flag) {
          this.enabled = flag;
          if (flag) {
            this.ensureInit();
          }
          if (this.master && this.ctx) {
            this.master.gain.setTargetAtTime(flag ? 0.75 : 0.0001, this.ctx.currentTime, 0.08);
          }
          return this.enabled;
        }

        toggle() {
          return this.setEnabled(!this.enabled);
        }

        updateSpiralDrone(spiralRatio) {
          if (!this.enabled || !this.ctx || !this.spiralGain) return;
          const targetGain = spiralRatio > 0.45 ? Math.min(0.08, (spiralRatio - 0.45) * 0.14) : 0.0001;
          this.spiralGain.gain.setTargetAtTime(targetGain, this.ctx.currentTime, 0.15);
        }

        // Formant-filtered percussive mouth-wind pop when a syllable exits the Sender's jaw
        playMouthWindPop(toneType, syllableSeed = 0.5) {
          if (!this.enabled || !this.ctx) return;
          const now = this.ctx.currentTime;

          // Glottal pulse oscillator through dual vocal-tract bandpass formants
          const osc = this.ctx.createOscillator();
          const f1 = this.ctx.createBiquadFilter();
          const f2 = this.ctx.createBiquadFilter();
          const gain = this.ctx.createGain();

          let baseFreq = 135 + syllableSeed * 90;
          let form1 = 560 + syllableSeed * 260;
          let form2 = 1480 + syllableSeed * 680;
          let dur = 0.14;

          if (toneType === 'period') {
            osc.type = 'square';
            baseFreq = 220;
            form1 = 1100;
            form2 = 2800;
            dur = 0.09;
          } else if (toneType === 'exclaim') {
            osc.type = 'sawtooth';
            baseFreq = 260 + syllableSeed * 140;
            form1 = 820;
            form2 = 2200;
            dur = 0.11;
          } else if (toneType === 'ellipsis') {
            osc.type = 'triangle';
            baseFreq = 105 + syllableSeed * 35;
            form1 = 380;
            form2 = 960;
            dur = 0.24;
          } else {
            osc.type = 'triangle';
          }

          osc.frequency.setValueAtTime(baseFreq * 1.18, now);
          osc.frequency.exponentialRampToValueAtTime(Math.max(55, baseFreq * 0.78), now + dur);

          f1.type = 'bandpass';
          f1.frequency.value = form1;
          f1.Q.value = 4.5;

          f2.type = 'bandpass';
          f2.frequency.value = form2;
          f2.Q.value = 5.5;

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(toneType === 'period' ? 0.13 : 0.09, now + 0.014);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

          osc.connect(f1);
          osc.connect(f2);
          f1.connect(gain);
          f2.connect(gain);
          gain.connect(this.master);

          osc.start(now);
          osc.stop(now + dur + 0.02);

          // Metallic click transient for passive-aggressive period
          if (toneType === 'period') {
            const clickOsc = this.ctx.createOscillator();
            const clickGain = this.ctx.createGain();
            clickOsc.type = 'sine';
            clickOsc.frequency.setValueAtTime(3400, now);
            clickOsc.frequency.exponentialRampToValueAtTime(920, now + 0.045);
            clickGain.gain.setValueAtTime(0.14, now);
            clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
            clickOsc.connect(clickGain);
            clickGain.connect(this.master);
            clickOsc.start(now);
            clickOsc.stop(now + 0.055);
          }
        }

        // Lush Major-9th harmonic chime when Harmonic Resonance Lock triggers
        playResonanceChord() {
          if (!this.enabled || !this.ctx) return;
          const now = this.ctx.currentTime;
          // D Major 9th: D4, F#4, A4, C#5, E5, A5
          const freqs = [293.66, 369.99, 440.0, 554.37, 659.25, 880.0];
          freqs.forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(f, now + idx * 0.055);

            gain.gain.setValueAtTime(0.0001, now + idx * 0.055);
            gain.gain.exponentialRampToValueAtTime(0.075 / (1 + idx * 0.16), now + idx * 0.055 + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.055 + 1.6);

            osc.connect(gain);
            gain.connect(this.master);
            osc.start(now + idx * 0.055);
            osc.stop(now + idx * 0.055 + 1.65);
          });
        }

        // Soft soothing exhale chord when user hits Breathe / Reset Skull
        playBreatheReset() {
          if (!this.enabled || !this.ctx) return;
          const now = this.ctx.currentTime;
          const freqs = [220.0, 277.18, 329.63, 440.0];
          freqs.forEach((f) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.045, now + 0.12);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
            osc.connect(gain);
            gain.connect(this.master);
            osc.start(now);
            osc.stop(now + 0.95);
          });
        }

      // =========================================================================
      // 2. 2D WAVE-INTERFERENCE SOLVER (Acoustic Soup Pressure & Color Grid)
      // =========================================================================
      class WaveInterferenceSolver {
        constructor(cols, rows) {
          this.resize(cols, rows);
        }

        resize(cols, rows) {
          this.cols = cols;
          this.rows = rows;
          this.size = cols * rows;

          this.u = new Float32Array(this.size);      // Current acoustic pressure
          this.uPrev = new Float32Array(this.size);  // Previous pressure
          this.uNext = new Float32Array(this.size);  // Next pressure
          this.tone = new Float32Array(this.size);   // -1 = crimson/magenta sharp, +1 = cyan/gold harmonic

          this.offscreen = document.createElement('canvas');
          this.offscreen.width = cols;
          this.offscreen.height = rows;
          this.offCtx = this.offscreen.getContext('2d');
          this.imgData = this.offCtx.createImageData(cols, rows);
          this.pixels32 = new Uint32Array(this.imgData.data.buffer);
        }

        clear() {
          this.u.fill(0);
          this.uPrev.fill(0);
          this.uNext.fill(0);
          this.tone.fill(0);
        }

        injectPulse(normX, normY, amplitude, radius = 2.6, toneVal = 1.0) {
          const gx = normX * (this.cols - 1);
          const gy = normY * (this.rows - 1);
          const r2 = radius * radius;
          const x0 = Math.max(1, Math.floor(gx - radius));
          const x1 = Math.min(this.cols - 2, Math.ceil(gx + radius));
          const y0 = Math.max(1, Math.floor(gy - radius));
          const y1 = Math.min(this.rows - 2, Math.ceil(gy + radius));

          for (let y = y0; y <= y1; y++) {
            const dy = y - gy;
            for (let x = x0; x <= x1; x++) {
              const dx = x - gx;
              const d2 = dx * dx + dy * dy;
              if (d2 <= r2) {
                const i = y * this.cols + x;
                const w = Math.exp(-d2 / (r2 * 0.5 + 0.08));
                this.u[i] = Math.max(-3.5, Math.min(3.5, this.u[i] + amplitude * w));
                this.tone[i] = Math.max(-1, Math.min(1, this.tone[i] * 0.65 + toneVal * 0.35 * w));
              }
            }
          }
        }

        step(humidityRatio) {
          const cols = this.cols;
          const rows = this.rows;
          const u = this.u;
          const uPrev = this.uPrev;
          const uNext = this.uNext;
          const tone = this.tone;

          // Higher humidity dampens acoustic waves faster
          const damping = 0.986 - humidityRatio * 0.022;

          for (let y = 1; y < rows - 1; y++) {
            const rowOff = y * cols;
            for (let x = 1; x < cols - 1; x++) {
              const i = rowOff + x;
              const lap = (u[i - 1] + u[i + 1] + u[i - cols] + u[i + cols]) * 0.5;
              const val = (lap - uPrev[i]) * damping;
              uNext[i] = val > 3.5 ? 3.5 : (val < -3.5 ? -3.5 : val);

              // Diffuse tone polarity gently
              tone[i] = (tone[i] * 0.92 + (tone[i - 1] + tone[i + 1] + tone[i - cols] + tone[i + cols]) * 0.02) * 0.996;
            }
          }

          // Absorbing soft boundaries so edges don't trap artificial reflections
          for (let x = 0; x < cols; x++) {
            uNext[x] = uNext[cols + x] * 0.72;
            uNext[(rows - 1) * cols + x] = uNext[(rows - 2) * cols + x] * 0.72;
          }
          for (let y = 0; y < rows; y++) {
            uNext[y * cols] = uNext[y * cols + 1] * 0.72;
            uNext[y * cols + (cols - 1)] = uNext[y * cols + (cols - 2)] * 0.72;
          }

          // Rotate buffers
          const tmp = this.uPrev;
          this.uPrev = this.u;
          this.u = this.uNext;
          this.uNext = tmp;
        }

        sampleGradient(normX, normY) {
          const gx = Math.max(1, Math.min(this.cols - 2, normX * (this.cols - 1)));
          const gy = Math.max(1, Math.min(this.rows - 2, normY * (this.rows - 1)));
          const x = gx | 0;
          const y = gy | 0;
          const i = y * this.cols + x;
          return {
            p: this.u[i],
            dx: (this.u[i + 1] - this.u[i - 1]) * 0.5,
            dy: (this.u[i + this.cols] - this.u[i - this.cols]) * 0.5
          };
        }

        renderToOffscreen(time, humidityRatio) {
          const cols = this.cols;
          const rows = this.rows;
          const u = this.u;
          const tone = this.tone;
          const pix = this.pixels32;

          for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
              const i = y * cols + x;
              const p = u[i];
              const absP = Math.abs(p);
              const t = tone[i]; // -1 sharp/crimson, +1 harmonic/cyan-gold

              // Deep obsidian-indigo void (#06050d -> R:6, G:5, B:13)
              let r = 6 + humidityRatio * 5;
              let g = 5 + humidityRatio * 6;
              let b = 13 + humidityRatio * 14;

              if (absP > 0.008) {
                // Interference fringe band shimmer
                const fringe = Math.sin(absP * 11.0 - time * 3.0) * 0.25 + 0.85;
                const intensity = Math.min(1.5, absP * 1.45) * fringe;

                if (t >= 0) {
                  // Harmonic Cyan (#38f2ff) & Warm Amber-Gold (#ffbe55) on positive crests
                  if (p >= 0) {
                    r += intensity * (34 + t * 22);
                    g += intensity * (195 + t * 45);
                    b += intensity * 245;
                  } else {
                    r += intensity * 215;
                    g += intensity * 155;
                    b += intensity * 72;
                  }
                } else {
                  // Sharp Crimson-Violet (#ff2e55) & Electric Magenta (#ff3b9a)
                  const sharp = -t;
                  r += intensity * (185 + sharp * 70);
                  g += intensity * (32 + (1 - sharp) * 40);
                  b += intensity * (115 + sharp * 60);
                }
              }

              const R = r > 255 ? 255 : r | 0;
              const G = g > 255 ? 255 : g | 0;
              const B = b > 255 ? 255 : b | 0;
              pix[i] = (255 << 24) | (B << 16) | (G << 8) | R;
            }
          }

          this.offCtx.putImageData(this.imgData, 0, 0);
        }
      }

          g.vx += (perpX * windForce + (toRecX / axisLen) * crosswind * 32) * dt;
          g.vy += (perpY * windForce + (toRecY / axisLen) * crosswind * 32) * dt;

          // Humidity drag & sinking fog effect (especially for '...' ellipsis glyphs)
          const drag = 1 - humidity * (g.tone === 'ellipsis' ? 0.55 : 0.22) * dt;
          g.vx *= drag;
          g.vy *= drag;
          if (g.tone === 'ellipsis') {
            g.vy += (18 + humidity * 52) * dt; // Heavy fog sinks in high humidity
          } else if (g.tone === 'harmonic') {
            // Gentle sinusoidal undulation
            g.vx += perpX * Math.cos(g.phase) * 42 * dt;
            g.vy += perpY * Math.cos(g.phase) * 42 * dt;
          }

          g.x += g.vx * dt;
          g.y += g.vy * dt;

          // Emit subtle wave wakes behind moving glyphs
          if (Math.random() < dt * 14) {
            const toneSign = g.tone === 'harmonic' && !g.scrambled ? 0.8 : -0.7;
            waveSolver.injectPulse(toNormX(g.x), toNormY(g.y), 0.45, 1.8, toneSign);
          }

          // Check collision with rotating Ego-Interference Mirrors
          for (let mIdx = 0; mIdx < egoMirrors.length; mIdx++) {
            const m = egoMirrors[mIdx];
            const mx = safe.left + m.nx * safe.w;
            const my = safe.top + m.ny * safe.h;
            const distM = Math.hypot(g.x - mx, g.y - my);
            if (distM < m.radius + 10 && !g.scrambled) {
              g.scrambled = true;
              g.text = mutateTextThroughEgo(g.text);
              g.color = '#ff3b9a';
              g.glowColor = '#ff2e55';
              m.flash = 1.0;

              // Deflect slightly & inject phase noise into the acoustic soup
              const ang = Math.atan2(g.y - my, g.x - mx);
              g.vx += Math.cos(ang) * 75;
              g.vy += Math.sin(ang) * 75;
              waveSolver.injectPulse(m.nx, m.ny, 2.0, 2.8, -1.0);
              waveRings.push({ x: mx, y: my, r: 10, maxR: 75, color: '#ff3b9a', sharp: true, alpha: 0.8 });
            }
          }

          // Track receiver pupils toward incoming glyphs
          if (i === 0) {
            receiverSkull.pupilX = Math.max(-1, Math.min(1, (g.x - receiverSkull.x) / 140));
            receiverSkull.pupilY = Math.max(-1, Math.min(1, (g.y - receiverSkull.y) / 140));
          }

          // Check arrival at Receiver Skull's Eardrum / Cranium
          const distRec = Math.hypot(g.x - receiverSkull.x, g.y - receiverSkull.y);
          if (distRec < 42) {
            onGlyphHitReceiver(g);
            activeGlyphs.splice(i, 1);
            continue;
          }

          // Dissolve if humidity/wind blows glyph far out of safe arena or too old
          const outOfBounds =
            g.x < safe.left - 35 || g.x > safe.right + 35 ||
            g.y < safe.top - 35 || g.y > safe.bottom + 35 ||
            g.age > 7.5;

          if (outOfBounds) {
            if (g.tone === 'ellipsis' && humidity > 0.55) {
              overthinking = Math.min(100, overthinking + 5);
            }
            activeGlyphs.splice(i, 1);
          }
        }

        // 5. Update Expanding Wave Rings
        for (let i = waveRings.length - 1; i >= 0; i--) {
          const wr = waveRings[i];
          wr.r += (wr.maxR - wr.r) * dt * 3.5 + 32 * dt;
          wr.alpha -= dt * 0.9;
          if (wr.alpha <= 0) waveRings.splice(i, 1);
        }

        // 6. Gentle natural relaxation when not actively spiraling
        if (overthinking > 0 && overthinking < 80) {
          overthinking = Math.max(0, overthinking - dt * 1.4);
        }

        audio.updateSpiralDrone(overthinking / 100);
        updateHudReadout();
      }

      function onGlyphHitReceiver(g) {
        receiverSkull.earPulse = 1.0;

        if (g.tone === 'period' || g.scrambled) {

          waveRings.push({ x: receiverSkull.x, y: receiverSkull.y, r: 14, maxR: 125, color: '#38f2ff', sharp: false, alpha: 0.9 });

          if (phaseCoherence >= 85 && resonanceLockTimer <= 0) {
            resonanceLockTimer = 5.5;
            overthinking = 0;
            audio.playResonanceChord();
            showToast('✨ HARMONIC RESONANCE LOCK — STANDING-WAVE BRIDGE IGNITED!', '#ffbe55');

      // =========================================================================
      // 9. HIGH-DPI CANVAS RENDERING (Wave Interference, Skulls, Bridges, Glyphs)
      // =========================================================================
      function render() {
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#06050d';
        ctx.fillRect(0, 0, width, height);

        // 1. Render 2D Wave-Interference Solver across Safe Playable Arena
        waveSolver.renderToOffscreen(simTime, humidity);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(waveSolver.offscreen, safe.left, safe.top, safe.w, safe.h);

        // 2. Render Subtle Wave-Distorted Acoustic Grid & Crosswind Streamlines
        renderAcousticGridAndWind();

        // 3. Render Standing-Wave Bridge if Harmonic Resonance Lock is active
        if (resonanceLockTimer > 0 || phaseCoherence >= 85) {
          renderStandingWaveBridge();
        }

        // 4. Render Rotating Hexagonal Ego-Interference Mirrors
        renderEgoMirrors();

        // 5. Render Expanding Acoustic Wave Rings
        renderWaveRings();

        // 6. Render Sender & Receiver Floating Bioluminescent Skulls
        const facingRight = receiverSkull.x >= senderSkull.x;
        renderSkull(senderSkull, true, facingRight);
        renderSkull(receiverSkull, false, !facingRight);

        // 7. Render Airborne Neon Glyphs
        renderAirborneGlyphs();
      }

      function renderAcousticGridAndWind() {
        ctx.save();
        // Subtle arena boundary glow
        ctx.strokeStyle = 'rgba(56, 242, 255, 0.14)';
        ctx.lineWidth = 1;
        ctx.strokeRect(safe.left, safe.top, safe.w, safe.h);

        // Wave-warped acoustic lattice lines
        const spacing = width < 560 ? 34 : 44;
        ctx.strokeStyle = 'rgba(129, 140, 248, 0.08)';
        ctx.lineWidth = 1;

        for (let gx = safe.left + spacing; gx < safe.right; gx += spacing) {
          ctx.beginPath();
          for (let gy = safe.top; gy <= safe.bottom; gy += 18) {
            const sample = waveSolver.sampleGradient(toNormX(gx), toNormY(gy));
            const offsetX = sample.dx * 14;
            if (gy === safe.top) ctx.moveTo(gx + offsetX, gy);
            else ctx.lineTo(gx + offsetX, gy);
          }
          ctx.stroke();
        }

        // Ambient Humidity Motes & Crosswind Drift Streaks
        for (let i = 0; i < moistureMotes.length; i++) {
          const m = moistureMotes[i];
          m.ny = (m.ny + crosswind * 0.002 + 1) % 1;
          m.nx = (m.nx + Math.sin(simTime * 0.4 + m.phase) * 0.0005 + 1) % 1;
          const sx = safe.left + m.nx * safe.w;
          const sy = safe.top + m.ny * safe.h;
          const alpha = 0.12 + humidity * 0.35;
          ctx.fillStyle = `rgba(129, 140, 248, ${alpha})`;
          ctx.fillRect(sx, sy, m.size, m.size);
        }

        ctx.restore();
      }

      function renderStandingWaveBridge() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        const x1 = senderSkull.x;
        const y1 = senderSkull.y - 14;
        const x2 = receiverSkull.x;
        const y2 = receiverSkull.y - 14;
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;

        const alpha = resonanceLockTimer > 0 ? Math.min(1, resonanceLockTimer * 0.5) : 0.65;
        const harmonics = [
          { n: 3, amp: 16, color: `rgba(56, 242, 255, ${0.75 * alpha})`, speed: 5.5 },
          { n: 5, amp: 10, color: `rgba(255, 190, 85, ${0.85 * alpha})`, speed: -7.0 },
          { n: 7, amp: 6, color: `rgba(255, 255, 255, ${0.65 * alpha})`, speed: 9.0 }
        ];

        harmonics.forEach((h) => {
          ctx.strokeStyle = h.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          const steps = 64;
          for (let s = 0; s <= steps; s++) {
            const t = s / steps;
            const env = Math.sin(t * Math.PI);
            const wave = Math.sin(t * Math.PI * h.n) * Math.cos(simTime * h.speed) * h.amp * env;
            const px = x1 + dx * t + nx * wave;
            const py = y1 + dy * t + ny * wave;
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
        });

        ctx.restore();
      }

      function renderEgoMirrors() {
        if (egoMirrors.length === 0) return;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        egoMirrors.forEach((m) => {
          const mx = safe.left + m.nx * safe.w;
          const my = safe.top + m.ny * safe.h;
          const r = m.radius + m.flash * 7;

          // Translucent hexagonal mirror body
          ctx.beginPath();
          for (let v = 0; v <= 6; v++) {
            const a = m.angle + (v / 6) * Math.PI * 2;
            const vx = mx + Math.cos(a) * r;
            const vy = my + Math.sin(a) * r;
            if (v === 0) ctx.moveTo(vx, vy);
            else ctx.lineTo(vx, vy);
          }
          ctx.fillStyle = `rgba(255, 59, 154, ${0.08 + m.flash * 0.22})`;
          ctx.fill();
          ctx.strokeStyle = `rgba(255, 59, 154, ${0.58 + m.flash * 0.42})`;
          ctx.lineWidth = 1.6;
          ctx.stroke();

          // Inner reflective shard line
          ctx.beginPath();
          ctx.moveTo(mx + Math.cos(m.angle) * (r * 0.65), my + Math.sin(m.angle) * (r * 0.65));
          ctx.lineTo(mx - Math.cos(m.angle) * (r * 0.65), my - Math.sin(m.angle) * (r * 0.65));
          ctx.strokeStyle = 'rgba(255, 190, 85, 0.45)';
          ctx.stroke();

          ctx.font = '700 8.5px ui-monospace, Menlo, monospace';
          ctx.fillStyle = 'rgba(255, 155, 205, 0.82)';
          ctx.textAlign = 'center';
          ctx.fillText('EGO MIRROR', mx, my + r + 11);
        });

        ctx.restore();
      }

      function renderWaveRings() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < waveRings.length; i++) {
          const wr = waveRings[i];
          ctx.strokeStyle = wr.color;
          ctx.globalAlpha = Math.max(0, wr.alpha);
          ctx.lineWidth = wr.sharp ? 2.2 : 1.5;

          ctx.beginPath();
          if (wr.sharp) {
            // Sharp diamond shock-ring for passive-aggressive periods
            ctx.moveTo(wr.x, wr.y - wr.r);
            ctx.lineTo(wr.x + wr.r, wr.y);
            ctx.lineTo(wr.x, wr.y + wr.r);
            ctx.lineTo(wr.x - wr.r, wr.y);
            ctx.closePath();
          } else {
            ctx.arc(wr.x, wr.y, wr.r, 0, Math.PI * 2);
          }
          ctx.stroke();
        }
        ctx.restore();
      }

      function renderSkull(skull, isSender, facingRight) {
        const hoverY = Math.sin(simTime * 2.2 + (isSender ? 0 : 1.7)) * 4.5;
        const sx = skull.x;
        const sy = skull.y + hoverY;
        const scale = width < 560 ? 0.88 : 1.04;
        const dir = facingRight ? 1 : -1;

        const isSpiraling = !isSender && overthinking >= 75;
        const isLocked = resonanceLockTimer > 0 || phaseCoherence >= 85;

        const primaryColor = isSpiraling
          ? '#ff2e55'
          : isLocked
          ? '#ffbe55'
          : isSender
          ? '#38f2ff'
          : '#ffbe55';

        ctx.save();
        ctx.translate(sx, sy);

        // 1. Receiver Live Resonance / Overthinking Meter Ring around Cranium
        if (!isSender) {
          const ringR = 46 * scale;
          ctx.beginPath();
          ctx.arc(0, -4 * scale, ringR, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.16)';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Phase Coherence Arc (Cyan-Gold)
          const cohAngle = (phaseCoherence / 100) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(0, -4 * scale, ringR, -Math.PI * 0.5, -Math.PI * 0.5 + cohAngle);
          ctx.strokeStyle = '#38f2ff';
          ctx.lineWidth = 3;
          ctx.stroke();

          // Overthinking Spiral Arc (Crimson-Magenta)
          if (overthinking > 2) {
            const spiAngle = (overthinking / 100) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(0, -4 * scale, ringR + 5, -Math.PI * 0.5, -Math.PI * 0.5 + spiAngle);
            ctx.strokeStyle = '#ff2e55';
            ctx.lineWidth = 2.6;
            ctx.stroke();
          }

          // Orbiting Intrusive-Thought Bubbles during Overthinking Spiral
          if (overthinking >= 60) {
            const bubbleCount = overthinking >= 80 ? 4 : 2;
            ctx.font = '700 9px ui-monospace, Menlo, monospace';
            ctx.textAlign = 'center';
            for (let b = 0; b < bubbleCount; b++) {
              const ang = simTime * 1.45 + (b / bubbleCount) * Math.PI * 2;
              const orbRx = (62 + (b % 2) * 14) * scale;
              const orbRy = (46 + (b % 2) * 10) * scale;
              const bx = Math.cos(ang) * orbRx;
              const by = Math.sin(ang) * orbRy - 10;
              const label = INTRUSIVE_THOUGHTS[(b * 2 + Math.floor(simTime * 0.4)) % INTRUSIVE_THOUGHTS.length];

              ctx.fillStyle = 'rgba(30, 8, 22, 0.85)';
              const tw = ctx.measureText(label).width + 10;
              ctx.fillRect(bx - tw * 0.5, by - 9, tw, 14);
              ctx.strokeStyle = 'rgba(255, 46, 85, 0.65)';
              ctx.lineWidth = 1;
              ctx.strokeRect(bx - tw * 0.5, by - 9, tw, 14);
              ctx.fillStyle = '#fda4af';
              ctx.fillText(label, bx, by + 1);
            }
          }

          // Decoded Thought Bubble readout near Receiver
          if (receiverSkull.decodedAlpha > 0.04 && receiverSkull.decodedText) {
            ctx.globalAlpha = Math.min(1, receiverSkull.decodedAlpha);
            ctx.font = '700 10px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.textAlign = 'center';
            const msg = receiverSkull.decodedText.slice(0, 42);
            const mw = ctx.measureText(msg).width + 14;
            const by = -62 * scale;
            ctx.fillStyle = 'rgba(10, 9, 22, 0.88)';
            ctx.fillRect(-mw * 0.5, by - 11, mw, 18);
            ctx.strokeStyle = receiverSkull.decodedTone === 'period' ? '#ff2e55' : '#38f2ff';
            ctx.lineWidth = 1.2;
            ctx.strokeRect(-mw * 0.5, by - 11, mw, 18);
            ctx.fillStyle = receiverSkull.decodedTone === 'period' ? '#fda4af' : '#fef3c7';
            ctx.fillText(msg, 0, by + 1);
            ctx.globalAlpha = 1;
          }
        }

        // 2. Sender Skull's Virtual Vocal Tract Chamber (vibrating folds + constriction baffles)
        if (isSender) {
          const tractX = -dir * 38 * scale;
          const tractY = 14 * scale;
          const vib = Math.sin(simTime * 48) * (2 + senderSkull.vocalTension * 6);

          ctx.save();
          ctx.translate(tractX, tractY);
          // Throat chamber tube
          ctx.strokeStyle = 'rgba(56, 242, 255, 0.45)';
          ctx.fillStyle = 'rgba(10, 14, 30, 0.78)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.roundRect(-24 * scale, -13 * scale, 44 * scale, 26 * scale, 10);
          ctx.fill();
          ctx.stroke();

          // Dual vibrating vocal-fold membranes
          ctx.strokeStyle = senderSkull.vocalTension > 0.1 ? '#ffbe55' : '#38f2ff';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(-18 * scale, -5 * scale);
          ctx.quadraticCurveTo(0, (-5 + vib) * scale, 16 * scale, -3 * scale);
          ctx.moveTo(-18 * scale, 5 * scale);
          ctx.quadraticCurveTo(0, (5 - vib) * scale, 16 * scale, 3 * scale);
          ctx.stroke();

          // Tongue/teeth constriction baffles
          ctx.fillStyle = 'rgba(255, 59, 154, 0.65)';
          ctx.fillRect(6 * scale, -11 * scale, 3 * scale, 6 * scale);
          ctx.fillRect(6 * scale, 5 * scale, 3 * scale, 6 * scale);

          // Queued syllable indicator inside chamber
          if (vocalQueue.length > 0) {
            ctx.font = '700 8.5px ui-monospace, Menlo, monospace';
            ctx.fillStyle = '#ffbe55';
            ctx.textAlign = 'center';
            ctx.fillText(vocalQueue[0].text, -2 * scale, -17 * scale);
          }
          ctx.restore();
        }

        // Flip horizontally based on facing direction
        ctx.scale(dir * scale, scale);

        // 3. Articulated Hinged Jaw
        ctx.save();
        ctx.translate(-4, 14);
        ctx.rotate(skull.jawAngle * 0.55);
        ctx.fillStyle = 'rgba(12, 11, 28, 0.92)';
        ctx.strokeStyle = primaryColor;
        ctx.lineWidth = 2;
        ctx.shadowColor = primaryColor;
        ctx.shadowBlur = 10;

        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.lineTo(-4, 16);
        ctx.lineTo(18, 17);
        ctx.lineTo(22, 8);
        ctx.lineTo(8, 7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Lower teeth
        ctx.fillStyle = '#e2e8f0';
        for (let t = 0; t < 3; t++) {
          ctx.fillRect(9 + t * 4, 4, 2.5, 4);
        }
        ctx.restore();

        // 4. Cranium Dome & Cheekbone
        ctx.fillStyle = 'rgba(12, 11, 28, 0.92)';
        ctx.strokeStyle = primaryColor;
        ctx.lineWidth = 2.2;
        ctx.shadowColor = primaryColor;
        ctx.shadowBlur = 14;

        ctx.beginPath();
        ctx.moveTo(-22, 6);
        ctx.bezierCurveTo(-28, -24, 2, -34, 20, -20);
        ctx.bezierCurveTo(28, -12, 27, 2, 23, 12);
        ctx.lineTo(10, 12);
        ctx.lineTo(4, 6);
        ctx.lineTo(-8, 12);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        // Upper teeth
        ctx.fillStyle = '#e2e8f0';
        for (let t = 0; t < 3; t++) {
          ctx.fillRect(10 + t * 4, 12, 2.5, 4.5);
        }

        // 5. Nasal Cavity
        ctx.fillStyle = '#06050d';
        ctx.strokeStyle = primaryColor;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(19, 1);
        ctx.lineTo(23, 7);
        ctx.lineTo(17, 7);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 6. Glowing Eye Socket & Tracking Pupil / Spiral Eye
        const eyeX = 11;
        const eyeY = -6;
        ctx.fillStyle = '#06050d';
        ctx.beginPath();
        ctx.arc(eyeX, eyeY, 6.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = primaryColor;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        if (isSpiraling) {
          // Spinning crimson-magenta overthinking spiral eye!
          ctx.strokeStyle = '#ff3b9a';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          for (let a = 0; a < Math.PI * 4; a += 0.35) {
            const sr = (a / (Math.PI * 4)) * 5.6;
            const px = eyeX + Math.cos(a + simTime * 14) * sr;
            const py = eyeY + Math.sin(a + simTime * 14) * sr;
            if (a === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
        } else {
          ctx.fillStyle = isLocked ? '#ffbe55' : '#38f2ff';
          ctx.beginPath();
          ctx.arc(eyeX + skull.pupilX * dir * 2.2, eyeY + skull.pupilY * 2.2, 2.8, 0, Math.PI * 2);
          ctx.fill();
        }

        // 7. Glowing Spiral Eardrum Coil
        const earX = -10;
        const earY = -2;
        const earR = 6 + skull.earPulse * 3.5;
        ctx.strokeStyle = isSender ? '#38f2ff' : '#ffbe55';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        for (let a = 0; a < Math.PI * 3.5; a += 0.4) {
          const r = (a / (Math.PI * 3.5)) * earR;
          const px = earX + Math.cos(a - simTime * 6) * r;
          const py = earY + Math.sin(a - simTime * 6) * r;
          if (a === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();

        ctx.restore();

        // Role Label under Skull
        ctx.save();
        ctx.font = '800 9px ui-monospace, Menlo, monospace';
        ctx.fillStyle = primaryColor;
        ctx.textAlign = 'center';
        ctx.fillText(isSender ? 'SENDER SKULL' : 'RECEIVER SKULL', sx, sy + 42 * scale);
        ctx.restore();
      }

      function renderAirborneGlyphs() {
        if (activeGlyphs.length === 0) return;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let i = 0; i < activeGlyphs.length; i++) {
          const g = activeGlyphs[i];
          const blurAmt = g.tone === 'ellipsis' ? (6 + humidity * 14) : (8 + humidity * 6);

          ctx.save();
          ctx.translate(g.x, g.y);

          // Subtle orientation tilt along flight path
          const tilt = Math.max(-0.28, Math.min(0.28, Math.atan2(g.vy, Math.abs(g.vx) + 40) * 0.35));
          ctx.rotate(tilt);

          // Glowing acoustic aura pill behind glyph
          ctx.font = '800 13.5px -apple-system, BlinkMacSystemFont, sans-serif';
          const tw = ctx.measureText(g.text).width;

          ctx.shadowColor = g.glowColor;
          ctx.shadowBlur = blurAmt;
          ctx.fillStyle = g.tone === 'ellipsis' ? `rgba(129, 140, 248, ${Math.max(0.35, 1 - humidity * 0.45)})` : g.color;
          ctx.fillText(g.text, 0, 0);

          // Crisp inner core highlight
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.globalAlpha = g.tone === 'ellipsis' ? 0.55 : 0.85;
          ctx.fillText(g.text, 0, 0);

          // Sharpness underline for passive-aggressive periods
          if (g.tone === 'period') {
            ctx.strokeStyle = '#ff2e55';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(-tw * 0.5, 9);
            ctx.lineTo(tw * 0.5, 9);
            ctx.stroke();
          }

          ctx.restore();
        }

        ctx.restore();
      }

      // =========================================================================
      // 10. RESIZE OBSERVER & 60FPS ANIMATION LOOP
      // =========================================================================
      function handleResize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        updateLayoutBounds();
      }

      window.addEventListener('resize', handleResize);
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => handleResize());
        ro.observe(topHud);
        ro.observe(bottomDock);
      }

      let lastTime = performance.now();
      function animate(now) {
        const dt = Math.min(0.033, Math.max(0.004, (now - lastTime) / 1000));
        lastTime = now;

        updateSimulation(dt);
        render();

        requestAnimationFrame(animate);
      }

      window.onload = function () {
        handleResize();
        rebuildEgoMirrors();

        // Seed an initial gentle harmonic wave ripple across the void
        waveSolver.injectPulse(toNormX(senderSkull.x), toNormY(senderSkull.y), 2.2, 3.8, 1.0);
        waveSolver.injectPulse(toNormX(receiverSkull.x), toNormY(receiverSkull.y), 1.6, 3.4, 1.0);

        requestAnimationFrame(animate);
      };
    })();
  </script>
</body>
</html>
