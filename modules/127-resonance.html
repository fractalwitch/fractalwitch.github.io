<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>127 Black Hole Snap · Living Lattice</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050508;
      color: #e8e0f0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      padding: 1.5rem;
    }
    h1 {
      font-weight: 300;
      letter-spacing: 0.18em;
      font-size: 0.95rem;
      color: #c9a0ff;
      text-transform: uppercase;
    }
    #wrap {
      position: relative;
      border: 1px solid #2a2035;
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 0 50px rgba(160, 60, 255, 0.12),
        0 0 120px rgba(80, 20, 120, 0.08);
    }
    canvas {
      display: block;
      background: #000;
    }
    #readout {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 1.05rem;
      color: #e0a0ff;
      letter-spacing: 0.06em;
    }
    .controls {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: #121018;
      border: 1px solid #3a3048;
      color: #d0c8e0;
      padding: 0.42rem 1.05rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    button:hover {
      background: #1e1828;
      border-color: #6a5088;
    }
    button.active {
      background: #2a1840;
      border-color: #a060ff;
      color: #e8d0ff;
    }
    footer {
      margin-top: 0.3rem;
      font-size: 0.72rem;
      color: #4a4060;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <h1>127 · Black Hole Snap</h1>
  <div id="wrap">
    <canvas id="c" width="420" height="420"></canvas>
  </div>
  <div id="readout">Tuning: 126.000</div>
  <div class="controls">
    <button id="play">Play</button>
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
    <button id="loop" class="active">Loop</button>
  </div>
  <footer>∇ · Θ → 0 &nbsp;·&nbsp; Living Lattice &nbsp;·&nbsp; Motzkin 127</footer>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d', { alpha: false });
    const readout = document.getElementById('readout');

    const SIZE = 280;
    const W = canvas.width;
    const H = canvas.height;
    const N = 127;

    function seededRandom(seed) {
      let s = seed;
      return function () {
        s = (s * 1664525 + 1013904223) & 0xffffffff;
        return (s >>> 0) / 0xffffffff;
      };
    }
    const rand = seededRandom(42);
    const randomPhases = new Float64Array(N);
    for (let i = 0; i < N; i++) randomPhases[i] = rand() * 2 * Math.PI;

    const cosA = new Float64Array(N);
    const sinA = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      const a = (2 * Math.PI * i) / N;
      cosA[i] = Math.cos(a);
      sinA[i] = Math.sin(a);
    }

    function twilight(t) {
      t = ((t % 1) + 1) % 1;
      const stops = [
        [0.00, [0.25, 0.05, 0.35]],
        [0.15, [0.35, 0.20, 0.55]],
        [0.30, [0.25, 0.45, 0.70]],
        [0.45, [0.20, 0.65, 0.60]],
        [0.55, [0.45, 0.75, 0.35]],
        [0.70, [0.85, 0.70, 0.25]],
        [0.85, [0.85, 0.35, 0.45]],
        [1.00, [0.25, 0.05, 0.35]]
      ];
      let i = 0;
      while (i < stops.length - 1 && t > stops[i + 1][0]) i++;
      const t0 = stops[i][0], t1 = stops[i + 1][0];
      const f = (t - t0) / (t1 - t0);
      const c0 = stops[i][1], c1 = stops[i + 1][1];
      return [
        Math.round(255 * (c0[0] + f * (c1[0] - c0[0]))),
        Math.round(255 * (c0[1] + f * (c1[1] - c0[1]))),
        Math.round(255 * (c0[2] + f * (c1[2] - c0[2])))
      ];
    }

    function generateFrame(tune) {
      const mix = Math.max(0, Math.min(1, (tune - 126.0) / 1.0));
      const k = 13.0;
      const delta = new Float64Array(N);
      for (let i = 0; i < N; i++) {
        delta[i] = (1 - mix) * randomPhases[i] + mix * (2 * Math.PI * i);
      }

      const img = ctx.createImageData(W, H);
      const data = img.data;
      const grid = new Float64Array(SIZE * SIZE);
      let maxI = 0;
      const extent = 1.6;
      const step = (2 * extent) / (SIZE - 1);

      for (let iy = 0; iy < SIZE; iy++) {
        const y = -extent + iy * step;
        for (let ix = 0; ix < SIZE; ix++) {
          const x = -extent + ix * step;
          let re = 0, im = 0;
          for (let n = 0; n < N; n++) {
            const phase = k * (x * cosA[n] + y * sinA[n]) + delta[n];
            re += Math.cos(phase);
            im += Math.sin(phase);
          }
          re /= N; im /= N;
          const intensity = re * re + im * im;
          grid[iy * SIZE + ix] = intensity;
          if (intensity > maxI) maxI = intensity;
        }
      }

      const invMax = maxI > 0 ? 1 / maxI : 1;
      for (let i = 0; i < grid.length; i++) {
        grid[i] = Math.sqrt(grid[i] * invMax);
      }

      for (let py = 0; py < H; py++) {
        const sy = Math.min(SIZE - 1, Math.floor(py / H * SIZE));
        for (let px = 0; px < W; px++) {
          const sx = Math.min(SIZE - 1, Math.floor(px / W * SIZE));
          const v = grid[sy * SIZE + sx];
          const [r, g, b] = twilight(v);
          const idx = (py * W + px) * 4;
          data[idx] = r; data[idx+1] = g; data[idx+2] = b; data[idx+3] = 255;
        }
      }
      return img;
    }

    let frameIdx = 0;
    const steps = 25;
    const startTune = 126.0;
    const endTune = 127.0;
    const stepSize = (endTune - startTune) / (steps - 1);
    let playing = false;
    let looping = true;
    let lastTime = 0;
    const frameMs = 80;
    const cache = new Array(steps).fill(null);

    function getFrame(idx) {
      if (!cache[idx]) {
        cache[idx] = generateFrame(startTune + idx * stepSize);
      }
      return cache[idx];
    }

    function draw(idx) {
      ctx.putImageData(getFrame(idx), 0, 0);
      readout.textContent = `Tuning: ${(startTune + idx * stepSize).toFixed(3)}`;
    }

    function tick(ts) {
      if (!playing) return;
      if (ts - lastTime >= frameMs) {
        lastTime = ts;
        frameIdx++;
        if (frameIdx >= steps) {
          if (looping) frameIdx = 0;
          else {
            frameIdx = steps - 1;
            playing = false;
            document.getElementById('play').classList.remove('active');
          }
        }
        draw(frameIdx);
      }
      requestAnimationFrame(tick);
    }

    document.getElementById('play').onclick = () => {
      if (!playing) {
        playing = true;
        lastTime = performance.now();
        document.getElementById('play').classList.add('active');
        requestAnimationFrame(tick);
      }
    };
    document.getElementById('pause').onclick = () => {
      playing = false;
      document.getElementById('play').classList.remove('active');
    };
    document.getElementById('reset').onclick = () => {
      playing = false;
      frameIdx = 0;
      document.getElementById('play').classList.remove('active');
      draw(0);
    };
    document.getElementById('loop').onclick = (e) => {
      looping = !looping;
      e.target.classList.toggle('active', looping);
    };

    draw(0);
    setTimeout(() => { getFrame(1); getFrame(2); }, 80);
  </script>
</body>
</html>
