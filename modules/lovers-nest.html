<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>♥ | LIQUID LOVER'S NEST</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');
:root{ --void:#020005; --magenta:#ff00ff; --cyan:#00ffff; --rose:#ff0055; --violet:#8a2be2; --gold:#ffcc55; }
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; width:100%; height:100%; background:var(--void); overflow:hidden;
  font-family:'Courier Prime',monospace; color:#fff; touch-action:none; -webkit-user-select:none; user-select:none; }

/* LAYER 0 — gradient hue hub (the colorful aura, bottom) */
#huebg{ position:fixed; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(circle at 50% 46%, rgba(255,0,255,.26) 0%, rgba(0,255,255,.16) 32%, rgba(138,43,226,.15) 58%, rgba(2,0,5,1) 82%);
  animation:huerot 26s linear infinite; }
@keyframes huerot{ to{ filter:hue-rotate(360deg); } }

/* LAYER 1 — goo metaballs (GPU) */
#goo{ position:fixed; inset:0; z-index:1; width:100%; height:100%; display:block; pointer-events:none; }

/* LAYER 2 — gif discs */
#nest{ position:fixed; inset:0; z-index:2; overflow:hidden; }
#glass{ position:absolute; inset:0; }
.disc{ position:absolute; top:0; left:0; overflow:hidden; cursor:grab; will-change:transform,border-radius;
  box-shadow: inset 0 0 26px rgba(255,255,255,0.10), inset 8px 10px 28px rgba(255,255,255,0.06);
  /* soft gradient edge: the gif fades out at its rim and melts into the goo */
  -webkit-mask-image:radial-gradient(ellipse 100% 100% at 50% 50%, #000 84%, rgba(0,0,0,0) 100%);
  mask-image:radial-gradient(ellipse 100% 100% at 50% 50%, #000 84%, rgba(0,0,0,0) 100%); }
.disc img{ width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.disc .fill{ position:absolute; inset:0; }
.disc .gloss{ position:absolute; inset:0; pointer-events:none; mix-blend-mode:screen;
  background:radial-gradient(circle at 34% 26%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0) 20%); }
.disc.placeholder .fill{ animation:sheen 9s ease-in-out infinite; }
@keyframes sheen{ 0%,100%{ filter:brightness(.9) saturate(1.1);} 50%{ filter:brightness(1.2) saturate(1.5);} }

/* LAYER 3 — the LIQUID, lifted on top as a translucent flowing film.
   ↓↓ to put the water BACK UNDER the blobs, change z-index:3 to z-index:0 (and bump #huebg to -1). */
#fluid{ position:fixed; inset:0; z-index:3; width:100%; height:100%; display:block;
  pointer-events:none; opacity:0.45; mix-blend-mode:screen; background:transparent; }

#scanlines{ position:fixed; inset:0; z-index:40; pointer-events:none;
  background:repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,0.13) 3px); mix-blend-mode:multiply; opacity:.4; }
#vignette{ position:fixed; inset:0; z-index:41; pointer-events:none;
  background:radial-gradient(circle at 50% 45%, transparent 62%, rgba(2,0,5,0.6) 100%); }
#titles{ position:fixed; z-index:42; top:5vh; left:0; right:0; text-align:center; pointer-events:none; mix-blend-mode:exclusion; }
#titles h1{ font-family:'Cinzel',serif; font-weight:700; font-size:clamp(1.7rem,5.5vw,3.4rem); letter-spacing:.30em; margin:0 0 .4em; text-shadow:0 0 24px var(--magenta); }
#titles .eyebrow{ font-size:.7rem; letter-spacing:.45em; text-transform:uppercase; color:var(--cyan); opacity:.8; }
#invite{ position:fixed; z-index:42; left:0; right:0; bottom:13vh; text-align:center; pointer-events:none;
  font-size:.82rem; letter-spacing:.22em; color:var(--gold); opacity:.85; transition:opacity 1.1s; text-shadow:0 0 12px rgba(255,204,85,.5); }
#invite.gone{ opacity:0; }
.rim-ui{ position:fixed; z-index:50; bottom:2rem; left:1.4rem; display:flex; gap:.6rem; align-items:center; font-size:.72rem; letter-spacing:.2em; text-transform:uppercase; }
.rim-ui button{ background:transparent; color:var(--cyan); border:1px solid rgba(0,255,255,.4); padding:.6rem .9rem; font-family:'Courier Prime',monospace; font-size:.72rem; letter-spacing:.2em; cursor:pointer; transition:.3s; border-radius:2px; }
.rim-ui button:hover{ background:var(--cyan); color:#000; box-shadow:0 0 18px var(--cyan); }
.rim-ui button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
#count{ color:rgba(255,255,255,.4); }
#dropveil{ position:fixed; inset:0; z-index:60; pointer-events:none; display:flex; align-items:center; justify-content:center; background:rgba(20,0,42,.55); backdrop-filter:blur(3px); opacity:0; transition:opacity .25s; font-family:'Cinzel',serif; font-size:1.4rem; letter-spacing:.3em; color:var(--gold); text-transform:uppercase; }
#dropveil.show{ opacity:1; }
@media (prefers-reduced-motion: reduce){ .disc.placeholder .fill{ animation:none; } }
</style>
</head>
<body>

<div id="huebg"></div>
<canvas id="goo"></canvas>
<div id="nest"><div id="glass"></div></div>
<canvas id="fluid"></canvas>

<div id="scanlines"></div>
<div id="vignette"></div>
<div id="titles"><div class="eyebrow">a slow melt of clinging goo</div><h1>LIQUID LOVER'S NEST</h1></div>
<div id="invite">drag to stir · tap to lift · scroll / pinch a blob to resize</div>
<div class="rim-ui">
  <button id="addBtn">⊹ add gifs</button>
  <button id="resetBtn">⟳ recirculate</button>
  <span id="count"></span>
</div>
<div id="dropveil">release into the nest</div>
<input id="fileInput" type="file" accept="image/gif,image/*" multiple style="display:none">

<script>
/* ============================================================
   LIQUID LOVER'S NEST
   layers: hue hub · goo metaballs (GPU) · gif discs · liquid film (top, 45%)
   flow: slow lava-lamp drift, light cling, real spacing
   resize: scroll (desktop) / pinch (mobile) per blob
   ============================================================ */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* -------- PASTE GIF URLS HERE (optional) -------- */
const GIFS = [
  // "https://.../one.gif",
];

/* ---- TUNING KNOBS ---- */
const COUNT   = 9;      // placeholder count before you add gifs
const SIZE_MIN= 0.22;   // blob DIAMETER as fraction of short screen edge
const SIZE_MAX= 0.36;
const DRIFT   = 1.1;    // continuous current push (higher = wanders more)
const DAMP    = 0.94;   // velocity retention (higher = more glide)
const MAXSPD  = 1.8;    // hard speed cap px/frame — keeps it lava-slow
const STICK   = 0.010;  // faint surface-tension cling
const SEP     = 0.016;  // spacing push (higher = more room between blobs)
const THRESH  = 1.0;    // metaball merge threshold (lower = melts/bridges more)
const LIQUID_OPACITY = 0.45;   // the top water film (also set in #fluid css)
const MAX_BLOBS = 40;

const PALETTE = ['#ff00ff','#00ffff','#ff0055','#8a2be2','#ffcc55'];
const hexRGB = h=>[parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
const hsl2rgb=(h,sa,l)=>{const a=sa*Math.min(l,1-l);const f=n=>{const k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));};return[f(0),f(8),f(4)];};
const HUE_SPEED=3;   // degrees/sec the goo colour drifts (very slow) — raise for faster pulse

/* ===================== PART I — THE WATER ===================== */
const canvas=document.getElementById('fluid'); let fluidOK=false, splat=null;
(function initFluid(){
  const gl=canvas.getContext('webgl',{alpha:true,premultipliedAlpha:false,depth:false,stencil:false,antialias:false})||canvas.getContext('experimental-webgl');
  if(!gl) return; const hf=gl.getExtension('OES_texture_half_float'); gl.getExtension('OES_texture_half_float_linear'); if(!hf) return;
  const TT=hf.HALF_FLOAT_OES; const CFG={SIM_RES:REDUCE?128:200,DYE_DISS:0.984,VEL_DISS:0.992,PRESS_IT:18,RADIUS:0.0036};
  function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
  const vert=sh(gl.VERTEX_SHADER,`precision highp float;attribute vec2 aPosition;varying vec2 vUv,vL,vR,vT,vB;uniform vec2 texelSize;void main(){vUv=aPosition*0.5+0.5;vL=vUv-vec2(texelSize.x,0.);vR=vUv+vec2(texelSize.x,0.);vT=vUv+vec2(0.,texelSize.y);vB=vUv-vec2(0.,texelSize.y);gl_Position=vec4(aPosition,0.,1.);}`);
  function prog(f){const p=gl.createProgram();gl.attachShader(p,vert);gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);const u={},n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);for(let i=0;i<n;i++){const nm=gl.getActiveUniform(p,i).name;u[nm]=gl.getUniformLocation(p,nm);}return{p,u};}
  const splatP=prog(`precision highp float;varying vec2 vUv;uniform sampler2D uTarget;uniform float aspectRatio;uniform vec3 color;uniform vec2 point;uniform float radius;void main(){vec2 p=vUv-point;p.x*=aspectRatio;vec3 s=exp(-dot(p,p)/radius)*color;gl_FragColor=vec4(texture2D(uTarget,vUv).xyz+s,1.);}`);
  const advP=prog(`precision highp float;varying vec2 vUv;uniform sampler2D uVelocity,uSource;uniform vec2 texelSize;uniform float dt,dissipation;void main(){vec2 c=vUv-dt*texture2D(uVelocity,vUv).xy*texelSize;gl_FragColor=dissipation*texture2D(uSource,c);gl_FragColor.a=1.;}`);
  const divP=prog(`precision mediump float;varying vec2 vUv,vL,vR,vT,vB;uniform sampler2D uVelocity;void main(){float L=texture2D(uVelocity,vL).x,R=texture2D(uVelocity,vR).x,T=texture2D(uVelocity,vT).y,B=texture2D(uVelocity,vB).y;gl_FragColor=vec4(0.5*(R-L+T-B),0.,0.,1.);}`);
  const presP=prog(`precision mediump float;varying vec2 vUv,vL,vR,vT,vB;uniform sampler2D uPressure,uDivergence;void main(){float L=texture2D(uPressure,vL).x,R=texture2D(uPressure,vR).x,T=texture2D(uPressure,vT).x,B=texture2D(uPressure,vB).x,d=texture2D(uDivergence,vUv).x;gl_FragColor=vec4((L+R+B+T-d)*0.25,0.,0.,1.);}`);
  const gradP=prog(`precision mediump float;varying vec2 vUv,vL,vR,vT,vB;uniform sampler2D uPressure,uVelocity;void main(){float L=texture2D(uPressure,vL).x,R=texture2D(uPressure,vR).x,T=texture2D(uPressure,vT).x,B=texture2D(uPressure,vB).x;vec2 v=texture2D(uVelocity,vUv).xy;v-=vec2(R-L,T-B);gl_FragColor=vec4(v,0.,1.);}`);
  const dispP=prog(`precision highp float;varying vec2 vUv;uniform sampler2D uTexture;void main(){vec3 c=texture2D(uTexture,vUv).rgb;float a=clamp(max(c.r,max(c.g,c.b))*1.4,0.,1.);gl_FragColor=vec4(c,a);}`);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,-1,1,1,1,1,-1]),gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array([0,1,2,0,2,3]),gl.STATIC_DRAW);
  gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);gl.enableVertexAttribArray(0);
  function FBO(w,h){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,TT,null);const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT);return{tex:t,fbo:f,w,h,tx:1/w,ty:1/h,attach(id){gl.activeTexture(gl.TEXTURE0+id);gl.bindTexture(gl.TEXTURE_2D,t);return id;}};}
  function DBL(w,h){let a=FBO(w,h),b=FBO(w,h);return{get read(){return a;},get write(){return b;},swap(){const t=a;a=b;b=t;}};}
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE) return;
  let SW,SH,vel,dye,div,pre;
  function alloc(){const ar=canvas.width/canvas.height;SH=CFG.SIM_RES;SW=Math.round(CFG.SIM_RES*ar);vel=DBL(SW,SH);dye=DBL(SW,SH);div=FBO(SW,SH);pre=DBL(SW,SH);}
  function resize(){canvas.width=innerWidth;canvas.height=innerHeight;alloc();}
  resize();addEventListener('resize',()=>{clearTimeout(window.__rz1);window.__rz1=setTimeout(resize,150);});
  function draw(t){gl.bindFramebuffer(gl.FRAMEBUFFER,t?t.fbo:null);gl.viewport(0,0,t?t.w:canvas.width,t?t.h:canvas.height);gl.drawElements(gl.TRIANGLES,6,gl.UNSIGNED_SHORT,0);}
  function use(pr){gl.useProgram(pr.p);return pr.u;}
  splat=function(x,y,dx,dy,color){if(!vel)return;let u=use(splatP);gl.uniform1i(u.uTarget,vel.read.attach(0));gl.uniform1f(u.aspectRatio,canvas.width/canvas.height);gl.uniform2f(u.point,x,y);gl.uniform3f(u.color,dx,dy,0.);gl.uniform1f(u.radius,CFG.RADIUS);gl.uniform2f(u.texelSize,vel.read.tx,vel.read.ty);draw(vel.write);vel.swap();u=use(splatP);gl.uniform1i(u.uTarget,dye.read.attach(0));gl.uniform1f(u.aspectRatio,canvas.width/canvas.height);gl.uniform2f(u.point,x,y);gl.uniform3f(u.color,color[0],color[1],color[2]);gl.uniform1f(u.radius,CFG.RADIUS);gl.uniform2f(u.texelSize,dye.read.tx,dye.read.ty);draw(dye.write);dye.swap();};
  let last=performance.now();
  function step(now){let dt=Math.min((now-last)/1000,0.016);last=now;gl.disable(gl.BLEND);const tx=vel.read.tx,ty=vel.read.ty;
    let u=use(advP);gl.uniform2f(u.texelSize,tx,ty);gl.uniform1i(u.uVelocity,vel.read.attach(0));gl.uniform1i(u.uSource,vel.read.attach(0));gl.uniform1f(u.dt,dt);gl.uniform1f(u.dissipation,CFG.VEL_DISS);draw(vel.write);vel.swap();
    u=use(advP);gl.uniform2f(u.texelSize,tx,ty);gl.uniform1i(u.uVelocity,vel.read.attach(0));gl.uniform1i(u.uSource,dye.read.attach(1));gl.uniform1f(u.dt,dt);gl.uniform1f(u.dissipation,CFG.DYE_DISS);draw(dye.write);dye.swap();
    u=use(divP);gl.uniform2f(u.texelSize,tx,ty);gl.uniform1i(u.uVelocity,vel.read.attach(0));draw(div);
    u=use(presP);gl.uniform2f(u.texelSize,tx,ty);gl.uniform1i(u.uDivergence,div.attach(0));for(let i=0;i<CFG.PRESS_IT;i++){gl.uniform1i(u.uPressure,pre.read.attach(1));draw(pre.write);pre.swap();}
    u=use(gradP);gl.uniform2f(u.texelSize,tx,ty);gl.uniform1i(u.uPressure,pre.read.attach(0));gl.uniform1i(u.uVelocity,vel.read.attach(1));draw(vel.write);vel.swap();
    gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
    u=use(dispP);gl.uniform2f(u.texelSize,tx,ty);gl.uniform1i(u.uTexture,dye.read.attach(0));draw(null);
    requestAnimationFrame(step);}
  requestAnimationFrame(step); fluidOK=true;
  function ambient(){if(!fluidOK)return;const r=Math.random(),col=r>0.66?[0.10,0,0.14]:r>0.33?[0,0.10,0.12]:[0.13,0,0.05];splat(Math.random(),Math.random(),(Math.random()-0.5)*90,(Math.random()-0.5)*90,col);setTimeout(ambient,900+Math.random()*700);}
  setTimeout(ambient,300);
})();

/* ===================== PART II — THE GOO (GPU metaballs) ===================== */
const gcanvas=document.getElementById('goo'); let gooOK=false, gooDraw=null;
(function initGoo(){
  const gl=gcanvas.getContext('webgl',{alpha:true,premultipliedAlpha:false,antialias:true,depth:false,stencil:false})||gcanvas.getContext('experimental-webgl');
  if(!gl) return;
  function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(o));return o;}
  const v=sh(gl.VERTEX_SHADER,`attribute vec2 aP;void main(){gl_Position=vec4(aP,0.,1.);}`);
  const f=sh(gl.FRAGMENT_SHADER,`precision highp float;
    uniform vec2 uRes; uniform int uCount; uniform float uThresh;
    uniform vec4 uBlobs[${MAX_BLOBS}]; uniform vec3 uColors[${MAX_BLOBS}];   // xy=center, zw=rx,ry
    void main(){
      vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
      float field=0.0; vec3 col=vec3(0.0); float wsum=0.0;
      vec2 bestC=vec2(0.0); vec2 bestRR=vec2(1.0); float bestK=-1.0;
      for(int i=0;i<${MAX_BLOBS};i++){
        if(i>=uCount) break;
        vec2 c=uBlobs[i].xy; vec2 rr=uBlobs[i].zw;
        vec2 q=(p-c)/rr; float d2=dot(q,q)+0.0002; float k=1.0/d2;   // elliptical field
        field+=k; float w=k*k; col+=uColors[i]*w; wsum+=w;
        if(k>bestK){bestK=k;bestC=c;bestRR=rr;}
      }
      if(wsum>0.0) col/=wsum;
      float a=smoothstep(uThresh*0.72,uThresh,field);
      if(a<=0.003) discard;
      float core=smoothstep(uThresh*0.9,uThresh*2.6,field);
      vec3 outc=mix(col*0.5,col*1.42,core);            // brighter, more saturated melt
      vec2 rel=(p-bestC)/bestRR;
      float hl=smoothstep(0.85,0.0,length(rel-vec2(-0.28,-0.34)));
      outc+=hl*hl*0.5;
      gl_FragColor=vec4(outc*a,a);
    }`);
  const p=gl.createProgram();gl.attachShader(p,v);gl.attachShader(p,f);gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){console.warn(gl.getProgramInfoLog(p));return;}
  gl.useProgram(p);
  const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const aP=gl.getAttribLocation(p,'aP');gl.enableVertexAttribArray(aP);gl.vertexAttribPointer(aP,2,gl.FLOAT,false,0,0);
  const uRes=gl.getUniformLocation(p,'uRes'),uCount=gl.getUniformLocation(p,'uCount'),uThresh=gl.getUniformLocation(p,'uThresh'),
        uBlobs=gl.getUniformLocation(p,'uBlobs[0]'),uColors=gl.getUniformLocation(p,'uColors[0]');
  const posArr=new Float32Array(MAX_BLOBS*4),colArr=new Float32Array(MAX_BLOBS*3);
  function resize(){gcanvas.width=innerWidth;gcanvas.height=innerHeight;gl.viewport(0,0,gcanvas.width,gcanvas.height);}
  resize();addEventListener('resize',()=>{clearTimeout(window.__rz2);window.__rz2=setTimeout(resize,150);});
  gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  gooDraw=function(list){
    gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    const n=Math.min(list.length,MAX_BLOBS);
    for(let i=0;i<n;i++){const b=list[i];posArr[i*4]=b.x;posArr[i*4+1]=b.y;posArr[i*4+2]=b.rx;posArr[i*4+3]=b.ry;colArr[i*3]=b.col[0];colArr[i*3+1]=b.col[1];colArr[i*3+2]=b.col[2];}
    gl.uniform2f(uRes,gcanvas.width,gcanvas.height);gl.uniform1i(uCount,n);gl.uniform1f(uThresh,THRESH);
    gl.uniform4fv(uBlobs,posArr);gl.uniform3fv(uColors,colArr);gl.drawArrays(gl.TRIANGLES,0,3);
  };
  gooOK=true;
})();

/* ===================== PART III — BODIES ===================== */
const glass=document.getElementById('glass'), countEl=document.getElementById('count');
let W=innerWidth,H=innerHeight,topZ=1;
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;});
const blobs=[]; const rand=(a,b)=>a+Math.random()*(b-a);
function flow(x,y,t){const T=[[3.1,2.7,0.31,-0.22],[1.9,2.3,-0.17,0.26]];let vx=0,vy=0;for(const[a,b,p,q]of T){const sx=Math.sin(a*x+p*t),cx=Math.cos(a*x+p*t),sy=Math.sin(b*y+q*t),cy=Math.cos(b*y+q*t);vx+=-b*sx*sy;vy+=-a*cx*cy;}return[vx,vy];}
function morph(t,seed){const p=i=>(50+Math.sin(t*0.5+seed+i*1.27)*13).toFixed(1);return `${p(0)}% ${p(1)}% ${p(2)}% ${p(3)}% / ${p(4)}% ${p(5)}% ${p(6)}% ${p(7)}%`;}

function dims(b){ const s=Math.sqrt(b.ar); b.rx=b.r*s; b.ry=b.r/s;
  b.Dw=b.rx*2*0.92; b.Dh=b.ry*2*0.92; b.disc.style.width=b.Dw+'px'; b.disc.style.height=b.Dh+'px'; }
function setR(b,r){ const base=Math.min(W,H); b.r=Math.max(base*0.05,Math.min(base*0.42,r)); dims(b); }

function makeBlob(src){
  if(blobs.length>=MAX_BLOBS) return null;
  const base=Math.min(W,H); const r=rand(base*SIZE_MIN, base*SIZE_MAX)/2;
  const col=hexRGB(PALETTE[(Math.random()*PALETTE.length)|0]);
  const disc=document.createElement('div'); disc.className='disc'+(src?'':' placeholder');
  if(src){const img=document.createElement('img');img.src=src;img.alt='';disc.appendChild(img);}
  else{const fill=document.createElement('div');fill.className='fill';const c2=PALETTE[(Math.random()*PALETTE.length)|0];fill.style.background=`radial-gradient(circle at 38% 32%, rgb(${col.map(c=>(c*255)|0).join(',')}) 0%, ${c2} 58%, #10021f 92%)`;disc.appendChild(fill);}
  const gloss=document.createElement('div');gloss.className='gloss';disc.appendChild(gloss);
  glass.appendChild(disc);
  const b={ disc,r,col,
    x:rand(r,W-r), y:rand(r+H*0.14,H-r-H*0.08),
    vx:rand(-0.6,0.6), vy:rand(-0.6,0.6), seed:rand(0,6.28),
    ar:rand(0.72,1.38),
    hue0:rand(0,360), hueDir:(Math.random()<0.5?-1:1)*(0.7+Math.random()*0.6) };
  dims(b);
  blobs.push(b); updateCount(); return b;
}
function updateCount(){ countEl.textContent=blobs.length+' blobs'; }

/* ===================== PART IV — POINTER + RESIZE ===================== */
let ptr={x:W/2,y:H/2,px:W/2,py:H/2,down:false}, invited=false, pinch=null, grabbed=null;
const invite=document.getElementById('invite');
function pt(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}
function blobAt(x,y){let best=null,bz=-1;for(const b of blobs){const dx=x-b.x,dy=y-b.y;if(dx*dx+dy*dy<=b.r*b.r){const z=+(b.disc.style.zIndex||0);if(z>=bz){bz=z;best=b;}}}return best;}
function nearestBlob(x,y){let best=null,bd=1e18;for(const b of blobs){const dx=x-b.x,dy=y-b.y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=b;}}return best;}

function down(e){const p=pt(e);ptr.x=ptr.px=p.x;ptr.y=ptr.py=p.y;ptr.down=true;
  if(!invited){invited=true;invite.classList.add('gone');}
  const b=blobAt(p.x,p.y);
  if(b){ b.disc.style.zIndex=++topZ; b.pop=1; grabbed={b,ox:p.x-b.x,oy:p.y-b.y,tx:b.x,ty:b.y}; }}
function move(e){const p=pt(e);ptr.px=ptr.x;ptr.py=ptr.y;ptr.x=p.x;ptr.y=p.y;const dx=ptr.x-ptr.px,dy=ptr.y-ptr.py;
  if(grabbed){ grabbed.tx=ptr.x-grabbed.ox; grabbed.ty=ptr.y-grabbed.oy;
    if(fluidOK){const c=grabbed.b.col;splat(grabbed.b.x/W,1-grabbed.b.y/H,dx*3,-dy*3,[c[0]*0.4,c[1]*0.4,c[2]*0.4]);}
    return; }
  if(fluidOK&&(ptr.down||Math.hypot(dx,dy)>1)){const r=Math.random(),col=r>0.66?[0.85,0,0.85]:r>0.33?[0,0.85,0.85]:[0.85,0,0.32];splat(ptr.x/W,1-ptr.y/H,dx*6,-dy*6,col);}
  for(const b of blobs){const ddx=b.x-ptr.x,ddy=b.y-ptr.y,d=Math.hypot(ddx,ddy);if(d<b.r+80){const k=(1-d/(b.r+80))*0.30;b.vx+=(dx*0.14+ddx/(d+1)*3)*k;b.vy+=(dy*0.14+ddy/(d+1)*3)*k;}}}
function up(){ptr.down=false;grabbed=null;}

/* mouse */
document.addEventListener('mousedown',down);
document.addEventListener('mousemove',move);
document.addEventListener('mouseup',up);
/* desktop scroll-to-resize a blob */
addEventListener('wheel',e=>{const b=blobAt(e.clientX,e.clientY);if(b){e.preventDefault();setR(b,b.r*(1-e.deltaY*0.0012));}},{passive:false});

/* touch: 1 finger = stir/lift, 2 fingers = pinch-resize a blob */
function tdist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
function tmid(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};}
document.addEventListener('touchstart',e=>{
  if(e.touches.length>=2){const m=tmid(e.touches[0],e.touches[1]);const b=blobAt(m.x,m.y)||nearestBlob(m.x,m.y);pinch=b?{b,d0:tdist(e.touches[0],e.touches[1]),r0:b.r}:null;}
  else down(e);
},{passive:true});
document.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length>=2&&pinch){const d=tdist(e.touches[0],e.touches[1]);setR(pinch.b,pinch.r0*(d/pinch.d0));}
  else if(e.touches.length===1) move(e);
},{passive:false});
document.addEventListener('touchend',e=>{ if(e.touches.length<2) pinch=null; if(e.touches.length===0) up(); });

/* ===================== PART V — THE LOOP (ooze · cling · melt) ===================== */
let t=0, prev=performance.now();
function loop(now){
  const dt=Math.min((now-prev)/1000,0.033); prev=now; t+=dt;
  // slow continuous drift (grabbed blob is hand-controlled, skip it)
  for(const b of blobs){ if(grabbed&&b===grabbed.b) continue; const [fx,fy]=flow(b.x/W*2.2,b.y/H*2.2,t*0.22); b.vx+=fx*DRIFT*dt; b.vy+=fy*DRIFT*dt; }
  // spacing (room to flow) + faint cling
  for(let i=0;i<blobs.length;i++)for(let j=i+1;j<blobs.length;j++){
    const a=blobs[i],c=blobs[j],dx=c.x-a.x,dy=c.y-a.y; let d=Math.hypot(dx,dy)||0.01;
    const sum=a.r+c.r, nx=dx/d, ny=dy/d;
    if(d<sum*1.06){ const f=SEP*(sum*1.06-d); a.vx-=nx*f;a.vy-=ny*f; c.vx+=nx*f;c.vy+=ny*f; }        // separate
    else if(d<sum*1.5){ const f=STICK*(d-sum*1.06); a.vx+=nx*f;a.vy+=ny*f; c.vx-=nx*f;c.vy-=ny*f; }  // faint cling
  }
  for(const b of blobs){
    if(grabbed&&b===grabbed.b){
      // direct drag: glide slowly toward the finger (gooey lag), keep momentum on release
      const nx=b.x+(grabbed.tx-b.x)*0.20, ny=b.y+(grabbed.ty-b.y)*0.20;
      b.vx=nx-b.x; b.vy=ny-b.y; b.x=nx; b.y=ny;
    } else {
      b.vx*=DAMP; b.vy*=DAMP;
      const sp=Math.hypot(b.vx,b.vy); if(sp>MAXSPD){b.vx*=MAXSPD/sp;b.vy*=MAXSPD/sp;}
      b.x+=b.vx; b.y+=b.vy;
    }
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*0.5;} if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*0.5;}
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*0.5;} if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*0.5;}
    if(b.pop) b.pop=Math.max(0,b.pop-dt*1.8);
    const pop=b.pop?b.pop*0.10:0;
    // slow RGB pulse — the goo body drifts hue on a very slow clock (gifs untouched)
    b.col=hsl2rgb(((b.hue0 + t*HUE_SPEED*b.hueDir)%360+360)%360/360, 1.0, 0.52);
    b.disc.style.transform=`translate3d(${(b.x-b.Dw/2).toFixed(1)}px,${(b.y-b.Dh/2).toFixed(1)}px,0) scale(${(1+pop).toFixed(3)})`;
    b.disc.style.borderRadius=morph(t,b.seed);
  }
  if(gooOK) gooDraw(blobs);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ===================== PART VI — LOADING ===================== */
function clearAll(){ blobs.forEach(b=>b.disc.remove()); blobs.length=0; }
function seed(){ clearAll(); if(GIFS.length) GIFS.forEach(u=>makeBlob(u)); else for(let i=0;i<COUNT;i++) makeBlob(null); updateCount(); }
seed();
function addFiles(list){const files=[...list].filter(f=>f.type.startsWith('image/'));if(!files.length)return;
  if(blobs.every(b=>b.disc.classList.contains('placeholder'))) clearAll();
  files.forEach(f=>makeBlob(URL.createObjectURL(f)));}
const fileInput=document.getElementById('fileInput');
document.getElementById('addBtn').addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>addFiles(e.target.files));
document.getElementById('resetBtn').addEventListener('click',seed);
const veil=document.getElementById('dropveil');
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();veil.classList.add('show');}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();veil.classList.remove('show');}));
document.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files);});
if(!fluidOK) canvas.style.display='none';
if(!gooOK) gcanvas.style.display='none';
</script>
</body>
</html>
