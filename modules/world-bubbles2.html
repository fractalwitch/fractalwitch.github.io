<!DOCTYPE html>
<html lang="en" data-mode="toy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strata World WebGPU</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
<style>
:root{--ink:#f3eaff;--dim:#b9a8d8;--acid:#c8ff4a;--pink:#ff6fd8;--glass:rgba(20,10,36,.84);--line:rgba(255,255,255,.12)}
html,body{margin:0;height:100%;background:#05020a;color:var(--ink);overflow:hidden;font:14px/1.5 ui-rounded,"SF Pro Rounded",system-ui,sans-serif}
#stagewrap{position:fixed;inset:0}#stage{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none;outline:none}
.dev{display:none!important}
html[data-mode=dev] .dev{display:block!important}
html[data-mode=dev] #stagewrap{right:390px}
#bench{position:fixed;top:0;right:0;bottom:0;width:390px;box-sizing:border-box;overflow-y:auto;padding:22px 20px 110px;touch-action:pan-y;background:var(--glass);border-left:1px solid var(--line);backdrop-filter:blur(10px)}
#bench h1{font-size:22px;margin:0 0 4px;letter-spacing:.02em}
#bench h2{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--acid);margin:22px 0 10px}
#bench p{color:var(--dim);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12px/1 ui-monospace,Menlo,monospace;color:var(--ink);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:9px 12px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--pink);color:#1a0618;border-color:transparent}
.chip:focus-visible,#toolbar button:focus-visible{outline:2px solid var(--acid);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:6px 0}
.row label{font-size:12.5px;color:var(--ink)}
.row output{font:11px ui-monospace,Menlo,monospace;color:var(--dim)}
.row input[type=range]{grid-column:1/3;width:100%;accent-color:var(--pink)}
.row input[type=color]{width:46px;height:26px;border:0;background:none;padding:0}
select,textarea{width:100%;box-sizing:border-box;background:rgba(0,0,0,.35);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:12px ui-monospace,Menlo,monospace}
textarea{height:130px;resize:vertical}
.tog{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:4px 0}
.anat li{margin:0 0 8px;color:var(--dim)}.anat b{color:var(--ink)}
#hud{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top));font:11.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre;pointer-events:none;color:#fff;text-shadow:0 1px 3px #000}
#mood{position:fixed;left:12px;bottom:calc(70px + env(safe-area-inset-bottom));margin:0;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--acid);pointer-events:none;text-shadow:0 1px 3px #000}
#hint{position:fixed;left:12px;right:410px;bottom:calc(88px + env(safe-area-inset-bottom));margin:0;font:12px ui-monospace,Menlo,monospace;color:#fff;opacity:.8;pointer-events:none;text-shadow:0 1px 3px #000}
#toolbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;border-radius:999px;padding:5px;background:rgba(12,6,24,.62);border:1px solid var(--line);backdrop-filter:blur(8px)}
#toolbar button{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;color:rgba(243,234,255,.85);background:transparent;border:0;border-radius:999px;padding:10px 16px;cursor:pointer}
#toolbar button[aria-pressed=true]{background:var(--acid);color:#0b1402}
#err{position:fixed;inset:auto 10px 70px 10px;color:#ffb3c7;font:12px monospace;white-space:pre-wrap;pointer-events:none}
@media (max-width:760px){html[data-mode=dev] #stagewrap{right:0;bottom:48vh}#bench{top:52vh;width:100%;border-left:0;border-top:1px solid var(--line)}#hint{right:12px;bottom:auto;top:calc(52vh - 44px)}#mood{bottom:auto;top:calc(52vh - 64px)}}
</style>
</head>
<body>
<div id="stagewrap"></div>
<div id="hud" class="dev"></div>
<p id="mood" class="dev">MOOD · CURIOUS</p>
<p id="hint" class="dev">drag · orbit   tap · poke an eye / pop a bubble / ripple   hold · melt + blow bubbles   double-tap · next world</p>
<aside id="bench" class="dev" aria-label="Lab controls"></aside>
<nav id="toolbar" aria-label="Mode"><button id="devbtn" type="button" aria-pressed="false">DEV MODE</button></nav>
<div id="err"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
